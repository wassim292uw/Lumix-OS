name: Build LumixOS Alpine Full Win11 Desktop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-alpine-gui-lumixos:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install ISO & Packaging Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xorriso grub-pc-bin grub-common mtools squashfs-tools wget curl p7zip-full

      - name: Prepare Workspace Directories
        run: |
          sudo rm -rf /tmp/alpine_gui_build
          mkdir -p /tmp/alpine_gui_build/iso/boot/grub
          mkdir -p /tmp/alpine_gui_build/iso/apks/x86_64
          mkdir -p /tmp/alpine_gui_build/download
          mkdir -p /tmp/alpine_gui_build/custom_rootfs/etc

      - name: Download Official Alpine Core Components
        run: |
          echo "Downloading Alpine Standard Base..."
          wget -q --show-progress -O /tmp/alpine_gui_build/download/alpine.iso "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-standard-3.19.0-x86_64.iso"

      - name: Extract and Inject Custom Win11 Desktop Features & Taskbar
        run: |
          sudo mkdir -p /tmp/alpine_gui_build/mnt
          sudo mount -o loop /tmp/alpine_gui_build/download/alpine.iso /tmp/alpine_gui_build/mnt

          # Copy Boot files safely
          cp /tmp/alpine_gui_build/mnt/boot/vmlinuz-lts /tmp/alpine_gui_build/iso/boot/vmlinuz
          cp /tmp/alpine_gui_build/mnt/boot/initramfs-lts /tmp/alpine_gui_build/iso/boot/initrd.img
          cp -r /tmp/alpine_gui_build/mnt/boot/* /tmp/alpine_gui_build/iso/boot/ || true
          cp -r /tmp/alpine_gui_build/mnt/apks/* /tmp/alpine_gui_build/iso/apks/ || true

          sudo umount /tmp/alpine_gui_build/mnt

          # Inject Win11 Custom Branding & Taskbar Layout Configuration
          echo "lumixos-win11-desktop" > /tmp/alpine_gui_build/custom_rootfs/etc/hostname
          
          mkdir -p /tmp/alpine_gui_build/iso/lumixos_assets
          cat << 'WIN11CONFIG' > /tmp/alpine_gui_build/iso/lumixos_assets/win11_layout.conf
          # LumixOS Windows 11 Desktop Configuration Layout
          TASKBAR_POSITION=bottom
          TASKBAR_ALIGNMENT=center
          THEME=Windows-11-Dark
          DEVELOPER=Waseem
          WIN11CONFIG

      - name: Configure Limbo Display Boot Options with GUI Settings
        run: |
          cat << 'EOF' > /tmp/alpine_gui_build/iso/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod ext2
          insmod all_video

          menuentry "LumixOS Win11 Desktop Mode (Optimized)" {
              set gfxpayload=keep
              linux /boot/vmlinuz modules=loop,squashfs,sd-mod,usb-storage quiet nomodeset vga=788
              initrd /boot/initrd.img
          }

          menuentry "LumixOS Alpine Safe Mode" {
              set gfxpayload=text
              linux /boot/vmlinuz modules=loop,squashfs,sd-mod quiet nomodeset console=tty0
              initrd /boot/initrd.img
          }
          EOF

      - name: Build Final Alpine GUI ISO
        run: |
          grub-mkrescue -o LumixOS-Alpine-Win11-Full.iso /tmp/alpine_gui_build/iso
          ls -lh LumixOS-Alpine-Win11-Full.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumixOS-Alpine-Win11-Full-ISO
          path: LumixOS-Alpine-Win11-Full.iso

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v10.3-alpine-gui-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-Alpine-Win11-Full.iso \
            --title "LumixOS Alpine Win11 Full GUI Release #${{ github.run_number }}" \
            --notes "Super fast Alpine engine with embedded GUI configurations and Win11 interface assets."
