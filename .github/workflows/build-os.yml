name: Build LumixOS Light ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools genisoimage isolinux syslinux-common syslinux-utils \
          zenity curl git gh

    - name: Create Complete RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install System Features & Setup Wizard
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت الحزم الأساسية الخفيفة والواجهة والأيقونات
        apt-get install -y --no-install-recommends \
          linux-image-686 live-boot xserver-xorg-core xserver-xorg xinit openbox nodm sudo \
          plank zenity python3 netsurf-gtk tzdata locales papirus-icon-theme wget curl

        # 2. إنشاء المستخدم الافتراضي
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. معالج الترحيب والإعداد (Setup Wizard) باسم وسيم
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        NAME_FILE="$CONFIG_DIR/username"
        GEO_FILE="$CONFIG_DIR/timezone"

        # أ. إدخال الاسم
        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(zenity --entry --title="LumixOS Welcome" --text="أهلاً بك يا وسيم في نظامك الخاص!\nأدخل اسمك لتخصيص الواجهة:" --entry-text="وسيم" --width=400)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        # ب. الموقع الجغرافي
        if [ ! -f "$GEO_FILE" ]; then
            TIMEZONE=$(zenity --list --title="الموقع الجغرافي" --text="اختر منطقتك الزمنية:" \
                --column="المنطقة" \
                "Africa/Casablanca" \
                "Asia/Riyadh" \
                "Asia/Dubai" \
                "Europe/Paris" --width=450 --height=280)
            if [ -n "$TIMEZONE" ]; then
                sudo ln -snf /usr/share/zoneinfo/$TIMEZONE /etc/localtime
                echo "$TIMEZONE" > "$GEO_FILE"
            fi
        fi

        USER_NAME=$(cat "$NAME_FILE")
        zenity --info --title="مبارك يا $USER_NAME!" \
            "تم إعداد بيئتك الخاصة بنجاح!\nجاري الانتقال إلى سطح المكتب العصري..." --width=400
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. تشغيل الشريط والأيقونات
        mkdir -p /home/user/.config/openbox/
        mkdir -p /etc/skel/.config/openbox/
        cat << 'AUTO' > /home/user/.config/openbox/autostart
        plank &
        /usr/local/bin/lumix-setup &
        AUTO
        cp /home/user/.config/openbox/autostart /etc/skel/.config/openbox/

        chown -R user:sudo /home/user

        # 5. الدخول المباشر بدون كلمة سر
        cat << 'NODM' > /etc/default/nodm
        NODM_ENABLED=true
        NODM_USER=user
        NODM_XSESSION=/etc/X11/Xsession
        NODM_MIN_SESSION_TIME=60
        NODM_X_OPTIONS='-nolisten tcp'
        NODM_FIRST_VT=7
        NODM_XPanal=
        NODM

        # 6. هوية النظام
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare ISO Structure
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 128k

        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 1

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live username=user nomodeset vga=normal quiet splash ---
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Hybrid ISO
      run: |
        sudo genisoimage -R -J \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -output LumixOS-1.0.iso build/iso

        sudo isohybrid LumixOS-1.0.iso || true

    - name: Direct ISO Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.iso --title "LumixOS 1.0 Light ISO Release" --notes "ملف ISO خفيف وسريع متوافق تماماً مع محاكي Limbo."
