name: Build LumixOS Professional Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          live-build debootstrap squashfs-tools genisoimage isolinux syslinux-common syslinux-utils \
          curl git gh

    - name: Configure Debian Live Build Environment
      run: |
        mkdir -p lumix-live
        cd lumix-live

        # إعداد هيكلية بناء نظام دبيان الحي
        lb config \
          --distribution bookworm \
          --architecture i386 \
          --binary-images iso \
          --bootloader isolinux \
          --debian-installer false \
          --archive-areas "main contrib non-free non-free-firmware"

        # إضافة حزم النظام الأساسية والنواة المضمنة بالكامل مع أدوات الترحيب
        mkdir -p config/package-lists
        cat << 'EOF' > config/package-lists/lumix.list.chroot
        systemd
        systemd-sysv
        init
        live-boot
        live-config
        whiptail
        python3
        sudo
        locales
        tzdata
        nano
        pciutils
        usbutils
        kmod
        udev
        procps
        linux-image-686-pae
        firmware-linux-free
        firmware-misc-nonfree
        EOF

        # إضافة إعدادات التكوين التلقائي والمستخدم ومعالج الترحيب
        mkdir -p config/includes.chroot/usr/local/bin
        cat << 'SETUP' > config/includes.chroot/usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        NAME_FILE="$CONFIG_DIR/username"

        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(whiptail --title "LumixOS Setup" --inputbox "أهلاً بك يا وسيم في نظامك الخاص LumixOS!\nأدخل اسمك لتخصيص الواجهة:" 10 50 "وسيم" 3>&1 1>&2 2>&3)
            if [ -z "$U_NAME" ]; then U_NAME="وسيم"; fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        USER_NAME=$(cat "$NAME_FILE")
        whiptail --msgbox "مبارك يا $USER_NAME!\nتم تشغيل نظام LumixOS بنجاح تام وبدون أخطاء." 10 50
        SETUP
        chmod +x config/includes.chroot/usr/local/bin/lumix-setup

        # تشغيل المعالج تلقائياً عند الدخول
        mkdir -p config/includes.chroot/etc/skel/.config/autostart
        mkdir -p config/includes.chroot/root
        
        # إنشاء السكربت لتفعيل الترحيب في شل المستخدم
        mkdir -p config/includes.chroot/etc/profile.d
        cat << 'PROF' > config/includes.chroot/etc/profile.d/lumix.sh
        if [ "$TERM" = "linux" ] && [ "$(tty)" = "/dev/tty1" ]; then
            /usr/local/bin/lumix-setup
        fi
        PROF
        chmod +x config/includes.chroot/etc/profile.d/lumix.sh

        # ضبط تسجيل الدخول التلقائي على tty1
        mkdir -p config/includes.chroot/etc/systemd/system/getty@tty1.service.d
        cat << 'GETTY' > config/includes.chroot/etc/systemd/system/getty@tty1.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
        GETTY

        cd ..

    - name: Build Live ISO Image
      run: |
        cd lumix-live
        sudo lb build
        cd ..

    - name: Rename and Prepare Final ISO
      run: |
        cd lumix-live
        ISO_FILE=$(find . -maxdepth 1 -name "*.iso" | head -n 1)
        cp "$ISO_FILE" ../LumixOS-Professional.iso
        cd ..
        ls -lh LumixOS-Professional.iso

    - name: Release Professional ISO
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-pro-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-Professional.iso --title "LumixOS 1.0 Professional Live Release" --notes "نسخة احترافية مبنية عبر أدوات Debian Live الرسمية لتجاوز مشاكل الـ Kernel Panic ودعم عتاد Limbo تماماً."
