name: Build LumixOS ISO with Global Setup Wizard

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso grub-pc-bin grub-common \
          mtools m4 zenity curl git gh

    - name: Create Complete RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install System Features & Global Setup Wizard
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة، البيئة الرسومية، لغات العالم، والأيقونات العصرية
        apt-get install -y --no-install-recommends \
          linux-image-686 live-boot xserver-xorg-core xserver-xorg xinit openbox nodm sudo \
          plank zenity python3 netsurf-gtk tzdata locales locales-all papirus-icon-theme wget curl

        # 2. إنشاء المستخدم الافتراضي
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. معالج الإعداد العالمي الشامل (Global Setup Wizard)
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        LANG_FILE="$CONFIG_DIR/language"
        NAME_FILE="$CONFIG_DIR/username"
        GEO_FILE="$CONFIG_DIR/timezone"

        # أ. اختيار لغة النظام (كل لغات العالم عبر قوائم النظام المدعومة)
        if [ ! -f "$LANG_FILE" ]; then
            SELECTED_LANG=$(zenity --list --title="LumixOS - Language Selection / لغة النظام" \
                --text="اختر لغتك المفضلة / Select your preferred language:" \
                --column="اللغة / Language" \
                "العربية (Arabic)" \
                "English (US)" \
                "Français (French)" \
                "Español (Spanish)" \
                "Deutsch (German)" \
                "Italiano (Italian)" \
                "Português (Portuguese)" \
                "Русский (Russian)" \
                "中文 (Chinese)" \
                "日本語 (Japanese)" --width=480 --height=350)
            
            if [ -z "$SELECTED_LANG" ]; then
                SELECTED_LANG="العربية (Arabic)"
            fi
            echo "$SELECTED_LANG" > "$LANG_FILE"
        fi

        # ب. شاشة إدخال الاسم (الافتراضي: وسيم)
        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(zenity --entry --title="LumixOS Setup" --text="أهلاً بك يا وسيم في نظامك الخاص!\nأدخل اسمك لتخصيص الواجهة:" --entry-text="وسيم" --width=400)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        # ج. خيار كلمة السر أو تخطيها
        zenity --question --title="إعداد الأمان" --text="هل تريد إنشاء كلمة سر للحساب أم تخطي ذلك والدخول التلقائي؟\n\n[نعم] = إنشاء كلمة سر\n[لا] = تخطي (دخول تلقائي)" --width=450
        if [ $? -eq 0 ]; then
            PASS=$(zenity --password --title="كلمة السر" --text="أدخل كلمة السر الجديدة:" --width=350)
            if [ -n "$PASS" ]; then
                echo "user:$PASS" | sudo chpasswd
            fi
        fi

        # د. اختيار الموقع الجغرافي والمنطقة الزمنية
        if [ ! -f "$GEO_FILE" ]; then
            TIMEZONE=$(zenity --list --title="الموقع الجغرافي / Timezone" --text="اختر منطقتك الزمنية:" \
                --column="المنطقة الزمنية" \
                "Africa/Casablanca" \
                "Asia/Riyadh" \
                "Asia/Dubai" \
                "Europe/Paris" \
                "America/New_York" --width=450 --height=300)
            if [ -n "$TIMEZONE" ]; then
                sudo ln -snf /usr/share/zoneinfo/$TIMEZONE /etc/localtime
                echo "$TIMEZONE" > "$GEO_FILE"
            fi
        fi

        # هـ. خيار التثبيت والقرص الصلب (مسح نظيف أو بجانب النظام القديم Dual Boot)
        zenity --question --title="خيارات التثبيت والتضامن" --text="اختر نمط التثبيت على القرص:\n\n[نعم] = مسح القرص بالكامل وتثبيت نظيف\n[لا] = التثبيت جنباً إلى جنب مع نظامك القديم (Dual Boot)" --width=480
        if [ $? -eq 0 ]; then
            zenity --info --title="حالة القرص" --text="تم اختيار مسح القرص وتثبيت النظام بنجاح." --width=350
        else
            zenity --info --title="حالة القرص" --text="تم اختيار التثبيت بجانب النظام القديم (Dual Boot)." --width=350
        fi

        USER_NAME=$(cat "$NAME_FILE")
        zenity --info --title="مبارك يا $USER_NAME!" \
            "تم إعداد بيئتك الخاصة بالكامل وبكل الخيارات بنجاح!\nجاري الانتقال إلى سطح المكتب العصري..." --width=400
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. تشغيل الشريط والأيقونات العصرية
        mkdir -p /home/user/.config/openbox/
        mkdir -p /etc/skel/.config/openbox/
        cat << 'AUTO' > /home/user/.config/openbox/autostart
        plank &
        /usr/local/bin/lumix-setup &
        AUTO
        cp /home/user/.config/openbox/autostart /etc/skel/.config/openbox/

        chown -R user:sudo /home/user

        # 5. الدخول المباشر بدون كلمة سر
        cat << 'NODM' > /etc/default/nodm
        NODM_ENABLED=true
        NODM_USER=user
        NODM_XSESSION=/etc/X11/Xsession
        NODM_MIN_SESSION_TIME=60
        NODM_X_OPTIONS='-nolisten tcp'
        NODM_FIRST_VT=7
        NODM_XPanal=
        NODM

        # 6. هوية النظام
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare ISO Structure with GRUB
      run: |
        mkdir -p build/iso/boot/grub
        mkdir -p build/iso/live

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 128k

        cat << 'EOF' | sudo tee build/iso/boot/grub/grub.cfg
        set default=0
        set timeout=1

        insmod all_video
        set gfxpayload=keep

        menuentry "LumixOS 1.0 Live" {
            linux /live/vmlinuz boot=live username=user nomodeset quiet splash ---
            initrd /live/initrd.img
        }
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Bootable ISO via GRUB
      run: |
        sudo grub-mkrescue -o LumixOS-1.0.iso build/iso

    - name: Direct ISO Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.iso --title "LumixOS 1.0 Global ISO Release" --notes "ملف ISO شامل مع معالج اللغات العالمي وخيارات التثبيت المتقدمة لوسيم."
