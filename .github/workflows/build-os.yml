name: Build LumixOS ISO (Lite & Stable)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso genisoimage isolinux syslinux-common syslinux-utils \
          wget zenity curl git

    - name: Create Base RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install Desktop, Features and Customizations
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت الواجهة والتطبيقات والألعاب
        apt-get install -y --no-install-recommends \
          linux-image-686 live-boot xorg xfce4 xfce4-terminal \
          plank papirus-icon-theme arc-theme firefox-esr wget curl zenity python3 \
          aisleriot gnome-mines gnome-sudoku

        # 2. هوية النظام
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0 (v86 Edition)"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        # 3. التشغيل التلقائي للشريط
        mkdir -p /etc/skel/.config/autostart/
        cat << 'AUTOSTART' > /etc/skel/.config/autostart/plank.desktop
        [Desktop Entry]
        Type=Application
        Exec=plank
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Plank Dock
        AUTOSTART

        # 4. أداة الترحيب
        mkdir -p /usr/local/bin/
        cat << 'APP' > /usr/local/bin/lumix-welcome
        #!/bin/bash
        zenity --info --title="LumixOS 1.0" --text="مرحباً بك يا وسيم في نظام LumixOS!" --width=300
        APP
        chmod +x /usr/local/bin/lumix-welcome

        cat << 'AUTOSTART_WELCOME' > /etc/skel/.config/autostart/lumix-welcome.desktop
        [Desktop Entry]
        Type=Application
        Exec=/usr/local/bin/lumix-welcome
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Lumix Welcome
        AUTOSTART_WELCOME

        # 5. ضبط المظهر
        mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        cat << 'XSETTINGS' > /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <channel name="xsettings" version="1.0">
          <property name="Net" type="empty">
            <property name="ThemeName" type="string" value="Arc-Dark"/>
            <property name="IconThemeName" type="string" value="Papirus-Dark"/>
          </property>
        </channel>
        XSETTINGS

        apt-get clean
        rm -rf /var/lib/apt/lists/*
        EOF

        sudo umount -l build/rootfs/dev
        sudo umount -l build/rootfs/proc
        sudo umount -l build/rootfs/sys

    - name: Extract Kernel and Prepare ISO Structure
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        # ضغط محمي ومباشر لتفادي خطأ exit code 13
        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 1024k

        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true
        sudo cp /usr/lib/syslinux/bios/*.c32 build/iso/isolinux/ || true

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 10

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live quiet splash ---
        EOF

    - name: Build ISO
      run: |
        genisoimage -logical-core-segment -cache-inodes -J -l -r \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -output LumixOS-1.0.iso build/iso

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumixOS-1.0-ISO
        path: LumixOS-1.0.iso
