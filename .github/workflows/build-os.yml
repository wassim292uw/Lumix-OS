name: Build LumixOS Alpine Full Win11 Desktop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-alpine-gui-lumixos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install ISO & Alpine Packaging Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xorriso grub-pc-bin grub-common mtools squashfs-tools wget curl p7zip-full

      - name: Prepare Workspace Directories
        run: |
          sudo rm -rf /tmp/alpine_gui_build
          mkdir -p /tmp/alpine_gui_build/iso/boot/grub
          mkdir -p /tmp/alpine_gui_build/download
          mkdir -p /tmp/alpine_gui_build/rootfs

      - name: Download Official Alpine Core Components
        run: |
          echo "Downloading Alpine Standard Base..."
          wget -q --show-progress -O /tmp/alpine_gui_build/download/alpine.iso "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-standard-3.19.0-x86_64.iso"

      - name: Extract Core ISO Files
        run: |
          sudo mkdir -p /tmp/alpine_gui_build/mnt
          sudo mount -o loop /tmp/alpine_gui_build/download/alpine.iso /tmp/alpine_gui_build/mnt

          sudo cp /tmp/alpine_gui_build/mnt/boot/vmlinuz-lts /tmp/alpine_gui_build/iso/boot/vmlinuz
          sudo cp /tmp/alpine_gui_build/mnt/boot/initramfs-lts /tmp/alpine_gui_build/iso/boot/initrd.img
          sudo cp -r /tmp/alpine_gui_build/mnt/boot/* /tmp/alpine_gui_build/iso/boot/ || true
          sudo cp -r /tmp/alpine_gui_build/mnt/apks /tmp/alpine_gui_build/iso/ || true

          sudo umount /tmp/alpine_gui_build/mnt

      - name: Inject Full Win11 GUI Desktop Features & Configuration Scripts
        run: |
          # Create Custom Setup Script inside ISO to Enable XFCE GUI Automatically
          sudo mkdir -p /tmp/alpine_gui_build/iso/lumixos_gui
          
          sudo bash -c "cat << 'GUISCRIPT' > /tmp/alpine_gui_build/iso/lumixos_gui/setup_gui.sh
          #!/bin/sh
          echo '--- Activating LumixOS Win11 Desktop Environment ---'
          setup-xorg-base xfce4 xfce4-terminal lightdm
          rc-update add lightdm default
          
          # Configure Taskbar at Bottom
          mkdir -p /root/.config/xfce4/xfconf/xfce-perchannel-xml/
          cat << 'PANEL' > /root/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
          <?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <channel name=\"xfce4-panel\" version=\"1.0\">
            <property name=\"panels\" type=\"array\">
              <value type=\"int\" value=\"1\"/>
            </property>
            <property name=\"panel-1\" type=\"empty\">
              <property name=\"position\" type=\"string\" value=\"p=10;x=0;y=0\"/>
              <property name=\"size\" type=\"uint\" value=\"38\"/>
              <property name=\"length\" type=\"uint\" value=\"100\"/>
            </property>
          </channel>
          PANEL
          GUISCRIPT"

          sudo chmod +x /tmp/alpine_gui_build/iso/lumixos_gui/setup_gui.sh

      - name: Configure Limbo Display Boot Options
        run: |
          sudo mkdir -p /tmp/alpine_gui_build/iso/boot/grub
          sudo bash -c "cat << 'EOF' > /tmp/alpine_gui_build/iso/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod ext2
          insmod all_video

          menuentry \"LumixOS Alpine Win11 Desktop Mode\" {
              set gfxpayload=keep
              linux /boot/vmlinuz modules=loop,squashfs,sd-mod,usb-storage quiet nomodeset vga=788
              initrd /boot/initrd.img
          }

          menuentry \"LumixOS Alpine Console Mode\" {
              set gfxpayload=text
              linux /boot/vmlinuz modules=loop,squashfs,sd-mod quiet nomodeset console=tty0
              initrd /boot/initrd.img
          }
          EOF"

      - name: Build Final Alpine GUI ISO
        run: |
          sudo grub-mkrescue -o LumixOS-Alpine-Win11-Full.iso /tmp/alpine_gui_build/iso
          ls -lh LumixOS-Alpine-Win11-Full.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumixOS-Alpine-Win11-Full-ISO
          path: LumixOS-Alpine-Win11-Full.iso

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v11.0-alpine-gui-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-Alpine-Win11-Full.iso \
            --title "LumixOS Alpine Win11 GUI Release #${{ github.run_number }}" \
            --notes "Full Graphical Alpine distribution with embedded XFCE GUI auto-installer and Win11 bottom taskbar layout."
