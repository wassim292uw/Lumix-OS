name: Build LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools \
          isolinux syslinux-utils ubuntu-keyring wget zenity

    - name: Create Base RootFS
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=amd64 --no-check-gpg jammy build/rootfs http://archive.ubuntu.com/ubuntu/ || true

    - name: Configure LumixOS Environment
      run: |
        sudo mount --bind /dev build/rootfs/dev || true
        sudo mount --bind /proc build/rootfs/proc || true
        sudo mount --bind /sys build/rootfs/sys || true

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash || true
        export DEBIAN_FRONTEND=noninteractive
        apt-get update --fix-missing || true

        # تثبيت حزم واجهة المستخدم والنواة
        apt-get install -y --no-install-recommends \
          linux-image-generic casper xorg xfce4 xfce4-goodies lightdm \
          plank papirus-icon-theme arc-theme firefox git wget curl zenity || true

        echo "lumixos" > /etc/hostname
        apt-get clean
        EOF

        sudo umount -l build/rootfs/dev || true
        sudo umount -l build/rootfs/proc || true
        sudo umount -l build/rootfs/sys || true

    - name: Build Live ISO Structure
      run: |
        mkdir -p build/iso/casper
        mkdir -p build/iso/isolinux

        # 1. نسخ ملفات الإقلاع والنواة
        sudo cp -L build/rootfs/boot/vmlinuz* build/iso/casper/vmlinuz || sudo cp -L /boot/vmlinuz* build/iso/casper/vmlinuz
        sudo cp -L build/rootfs/boot/initrd* build/iso/casper/initrd.img || sudo cp -L /boot/initrd* build/iso/casper/initrd.img

        # 2. ضغط النظام
        sudo mksquashfs build/rootfs build/iso/casper/filesystem.squashfs -comp xz

        # 3. إعداد محرك الإقلاع Isolinux
        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/ || true
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT live
        LABEL live
          MENU LABEL Start LumixOS 1.0 Live
          KERNEL /casper/vmlinuz
          APPEND initrd=/casper/initrd.img boot=casper quiet splash ---
        EOF

    - name: Generate Final ISO File
      run: |
        sudo xorriso -as mkisofs -r \
          -V "LumixOS" \
          -J -joliet-long \
          -b isolinux/isolinux.bin \
          -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -o LumixOS-1.0.iso build/iso

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumixOS-1.0-ISO
        path: LumixOS-1.0.iso
