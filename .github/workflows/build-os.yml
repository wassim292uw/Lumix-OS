name: Build LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools \
          isolinux syslinux-utils ubuntu-keyring wget zenity

    - name: Create Base RootFS
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=amd64 --no-check-gpg jammy build/rootfs http://archive.ubuntu.com/ubuntu/ || true

    - name: Configure and Customize LumixOS RootFS
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update --fix-missing || true

        # 1. تثبيت الواجهة والنواة وحزم الإقلاع المباشر
        apt-get install -y linux-image-generic casper xorg xfce4 lightdm \
          plank papirus-icon-theme arc-theme \
          aisleriot gnome-mines gnome-sudoku pingus wget curl zenity python3 || true

        # عمل رابط ثابت ومباشر للنواة لمنع أي خطأ في الأسماء
        cd /boot
        ln -sf vmlinuz-* vmlinuz || true
        ln -sf initrd.img-* initrd.img || true
        cd /

        # 2. تثبيت متصفح Google Chrome
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb || true
        apt-get install -y /tmp/chrome.deb || true
        rm -f /tmp/chrome.deb

        # 3. إخفاء معالم أوبونتو وتخصيص هوية LumixOS
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0 (Next-Gen Edition)"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        # 4. تفعيل شريط macOS Dock (Plank)
        mkdir -p /etc/skel/.config/autostart/
        cat << 'AUTOSTART' > /etc/skel/.config/autostart/plank.desktop
        [Desktop Entry]
        Type=Application
        Exec=plank
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Plank Dock
        AUTOSTART

        # 5. أداة اختيار وتثبيت البرامج التفاعلية (Lumix Welcome Center)
        mkdir -p /usr/local/bin/
        cat << 'APPINSTALLER' > /usr/local/bin/lumix-welcome
        #!/bin/bash
        CHOICES=$(zenity --list --checklist \
          --title="LumixOS Welcome & App Installer" \
          --text="اختر حزم البرامج والتطبيقات التي تريد تثبيتها على نظامك:" \
          --column="تثبيت" --column="الفئة" --column="التطبيقات المضمنة" \
          FALSE "أدوات البرمجة" "VS Code, Git, Python3, NodeJS" \
          FALSE "أدوات المونتاج والتصميم" "Kdenlive, GIMP, Inkscape, Audacity" \
          FALSE "أدوات الذكاء الاصطناعي" "Ollama AI, Local AI Workspace Tools" \
          FALSE "حزمة الألعاب والمكتبة" "Steam, Lutris, Retro Games" \
          --width=600 --height=400)

        if [ -n "$CHOICES" ]; then
          zenity --info --text="جاري بدء تثبيت البرامج المختارة..." --timeout=5
        fi
        APPINSTALLER
        chmod +x /usr/local/bin/lumix-welcome

        cat << 'AUTOSTART_WELCOME' > /etc/skel/.config/autostart/lumix-welcome.desktop
        [Desktop Entry]
        Type=Application
        Exec=/usr/local/bin/lumix-welcome
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Lumix Welcome Center
        AUTOSTART_WELCOME

        # 6. تطبيق المظهر والأيقونات
        mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        cat << 'XSETTINGS' > /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <channel name="xsettings" version="1.0">
          <property name="Net" type="empty">
            <property name="ThemeName" type="string" value="Arc-Dark"/>
            <property name="IconThemeName" type="string" value="Papirus-Dark"/>
          </property>
        </channel>
        XSETTINGS

        # 7. إضافة الخلفية
        mkdir -p /usr/share/backgrounds/lumix/
        wget "https://raw.githubusercontent.com/bashscript/assets/main/wallpaper.jpg" -O /usr/share/backgrounds/lumix/default.jpg || true

        apt-get clean
        EOF

        sudo umount -l build/rootfs/dev || true
        sudo umount -l build/rootfs/proc || true
        sudo umount -l build/rootfs/sys || true

    - name: Pack RootFS and Copy Kernel Directly
      run: |
        mkdir -p build/iso/casper
        sudo mksquashfs build/rootfs build/iso/casper/filesystem.squashfs -comp xz
        
        # نسخ النواة المربوطة رمزياً مباشرة بدون تعقيد
        sudo cp -L build/rootfs/boot/vmlinuz build/iso/casper/vmlinuz
        sudo cp -L build/rootfs/boot/initrd.img build/iso/casper/initrd.img

    - name: Create Safe GRUB Boot Menu for LumixOS
      run: |
        mkdir -p build/iso/boot/grub
        cat << 'EOF' > build/iso/boot/grub/grub.cfg
        set default=0
        set timeout=10

        insmod all_video
        insmod gfxterm

        menuentry "✦ Start LumixOS 1.0 (Live Environment)" {
            linux /casper/vmlinuz boot=casper quiet splash ---
            initrd /casper/initrd.img
        }

        menuentry "✦ LumixOS Safe Graphics Mode" {
            linux /casper/vmlinuz boot=casper nomodeset ---
            initrd /casper/initrd.img
        }
        EOF

    - name: Generate Final Live ISO Image
      run: |
        grub-mkrescue -o LumixOS-1.0.iso build/iso

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumixOS-1.0-ISO
        path: LumixOS-1.0.iso
