- name: Prepare ISO Structure
      run: |
        mkdir -p build/iso/boot
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/boot/vmlinuz
        sudo cp -L "$I_FILE" build/iso/boot/initrd.img

        sudo mksquashfs build/rootfs build/iso/boot/filesystem.squashfs -comp gzip -b 16k

        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true

        # تصحيح مسارات النواة وملف الجذر لكي تنطلق فوراً دون انتظار
        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 1

        LABEL lumix
          KERNEL /boot/vmlinuz
          APPEND initrd=/boot/initrd.img root=/dev/sr0 ro console=tty1 quiet fastboot nopv noapic nolapic nomodeset
        EOF

        sudo chmod -R 777 build/iso
