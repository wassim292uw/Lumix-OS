- name: Install Complete Kernel & System Modules
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # استخدام النواة الأكثر توافقاً مع محاكي Limbo لتجنب الـ Kernel Panic
        apt-get install -y linux-image-486 initramfs-tools firmware-linux-free

        mkdir -p /etc/network /root/etc/network

        ln -snf /lib/systemd/systemd /sbin/init
        ln -snf /lib/systemd/systemd /bin/init

        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        NAME_FILE="$CONFIG_DIR/username"

        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(whiptail --inputbox "أهلاً بك يا وسيم في نظامك الخاص LumixOS!\nأدخل اسمك:" 10 50 "وسيم" 3>&1 1>&2 2>&3)
            if [ -z "$U_NAME" ]; then U_NAME="وسيم"; fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        whiptail --msgbox "مبارك يا وسيم! تم إقلاع LumixOS بنجاح تام." 10 50
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        echo "/usr/local/bin/lumix-setup" >> /home/user/.bashrc
        chown -R user:sudo /home/user

        mkdir -p /etc/systemd/system/getty@tty1.service.d/
        cat << 'GETTY' > /etc/systemd/system/getty@tty1.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
        GETTY

        echo "lumixos" > /etc/hostname
        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true
