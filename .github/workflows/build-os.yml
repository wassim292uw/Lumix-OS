name: Build LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools genisoimage isolinux syslinux-common syslinux-utils \
          zenity curl git gh

    - name: Create Minimal RootFS for v86 (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install Essential Features & User Setup
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة والواجهة الأساسية الحفيفة جداً لضمان قراءتها في المحاكي
        apt-get install -y --no-install-recommends \
          linux-image-686 live-boot xserver-xorg-core xserver-xorg xinit openbox nodm sudo \
          plank zenity python3 netsurf-gtk

        # 2. إنشاء المستخدم بدون كلمة سر إطلاقاً
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. أداة الإعداد التفاعلي لتحديد الاسم عند أول تشغيل
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        NAME_FILE="$HOME/.config/lumix_username"

        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(zenity --entry --title="LumixOS Welcome" --text="أهلاً بك في LumixOS!\nأدخل اسمك لضبط إعدادات النظام:" --entry-text="وسيم" --width=350)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            mkdir -p "$HOME/.config/"
            echo "$U_NAME" > "$NAME_FILE"
        fi

        USER_NAME=$(cat "$NAME_FILE")
        zenity --info --title="LumixOS 1.0" --text="أهلاً بك يا $USER_NAME في نظام LumixOS!\nنتمنى لك تجربة ممتعة." --width=380
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. إعداد التشغيل التلقائي للشريط والأداة
        mkdir -p /home/user/.config/openbox/
        mkdir -p /etc/skel/.config/openbox/
        cat << 'AUTO' > /home/user/.config/openbox/autostart
        plank &
        /usr/local/bin/lumix-setup &
        AUTO
        cp /home/user/.config/openbox/autostart /etc/skel/.config/openbox/

        chown -R user:sudo /home/user

        # 5. الدخول المباشر التلقائي بدون كلمة سر
        cat << 'NODM' > /etc/default/nodm
        NODM_ENABLED=true
        NODM_USER=user
        NODM_XSESSION=/etc/X11/Xsession
        NODM_MIN_SESSION_TIME=60
        NODM_X_OPTIONS='-nolisten tcp'
        NODM_FIRST_VT=7
        NODM_XPanal=
        NODM

        # 6. ضبط هوية النظام
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        # تنظيف لتقليل الحجم لكي يقبله محاكي v86 فك القراءة
        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /usr/share/doc/* /usr/share/man/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare ISO Directory
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        # ضغط عالي للحفاظ على الحجم الخفيف الذي يقبله v86
        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 256k

        # نسخ ملفات الإقلاع كاملة
        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true
        sudo cp /usr/lib/syslinux/bios/*.c32 build/iso/isolinux/ || true

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 10

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live username=user nomodeset vga=normal quiet splash ---
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Bootable Hybrid ISO
      run: |
        sudo genisoimage -R -J \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -output LumixOS-1.0.iso build/iso

        # تحويل ISO إلى نظام هجين يفهمه محاكي v86
        sudo isohybrid LumixOS-1.0.iso || true

    - name: Direct ISO Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.iso --title "LumixOS 1.0 ISO Direct Release" --notes "ملف ISO مباشر وخفيف مخصص للمحاكي v86."
