name: Build LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install All Essential ISO Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso genisoimage grub-pc-bin grub-efi-amd64-bin mtools \
          isolinux syslinux-utils ubuntu-keyring wget zenity curl git

    - name: Create Base RootFS Architecture
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=amd64 --no-check-gpg jammy build/rootfs http://archive.ubuntu.com/ubuntu/

    - name: Install Complete System Packages and Customizations
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update --fix-missing

        # 1. تثبيت النواة المباشرة الرسمية وواجهة المستخدم والبرامج
        apt-get install -y --no-install-recommends \
          linux-image-generic casper xorg xfce4 xfce4-goodies lightdm \
          plank papirus-icon-theme arc-theme firefox git wget curl zenity \
          aisleriot gnome-mines gnome-sudoku pingus python3

        # 2. تخصيص إعدادات هوية LumixOS
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0 (Next-Gen Edition)"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        # 3. إعداد التشغيل التلقائي لشريط macOS (Plank)
        mkdir -p /etc/skel/.config/autostart/
        cat << 'AUTOSTART' > /etc/skel/.config/autostart/plank.desktop
        [Desktop Entry]
        Type=Application
        Exec=plank
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Plank Dock
        AUTOSTART

        # 4. بناء أداة الترحيب والتطبيقات
        mkdir -p /usr/local/bin/
        cat << 'APPINSTALLER' > /usr/local/bin/lumix-welcome
        #!/bin/bash
        zenity --info --title="LumixOS 1.0" --text="مرحباً بك في نظام LumixOS! جميع الحزم والتطبيقات مثبتة ومجهزة بنجاح." --width=400
        APPINSTALLER
        chmod +x /usr/local/bin/lumix-welcome

        cat << 'AUTOSTART_WELCOME' > /etc/skel/.config/autostart/lumix-welcome.desktop
        [Desktop Entry]
        Type=Application
        Exec=/usr/local/bin/lumix-welcome
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Lumix Welcome Center
        AUTOSTART_WELCOME

        # 5. ضبط الثيم والأيقونات
        mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        cat << 'XSETTINGS' > /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <channel name="xsettings" version="1.0">
          <property name="Net" type="empty">
            <property name="ThemeName" type="string" value="Arc-Dark"/>
            <property name="IconThemeName" type="string" value="Papirus-Dark"/>
          </property>
        </channel>
        XSETTINGS

        apt-get clean
        EOF

        sudo umount -l build/rootfs/dev
        sudo umount -l build/rootfs/proc
        sudo umount -l build/rootfs/sys

    - name: Extract Kernel and Pack RootFS
      run: |
        mkdir -p build/iso/casper
        mkdir -p build/iso/boot/grub
        mkdir -p build/iso/isolinux

        # استخراج النواة المباشرة ونقلها بمسار مؤكد
        KERNEL_PATH=$(ls build/rootfs/boot/vmlinuz-* | head -n 1)
        INITRD_PATH=$(ls build/rootfs/boot/initrd.img-* | head -n 1)

        sudo cp -L "$KERNEL_PATH" build/iso/casper/vmlinuz
        sudo cp -L "$INITRD_PATH" build/iso/casper/initrd.img

        # ضغط بيئة النظام كاملاً لملف filesystem.squashfs
        sudo mksquashfs build/rootfs build/iso/casper/filesystem.squashfs -comp xz

        # نسخ ملفات الإقلاع لضمان توافقية البناء السريع
        if [ -f /usr/lib/ISOLINUX/isolinux.bin ]; then
          sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
          sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true
        fi

        # إنشاء قائمة الإقلاع الكلاسيكية المضمونة
        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        default live
        label live
          kernel /casper/vmlinuz
          append initrd=/casper/initrd.img boot=casper quiet splash ---
        EOF

        # إنشاء ملف الإقلاع GRUB الاحتياطي
        cat << 'EOF' | sudo tee build/iso/boot/grub/grub.cfg
        set default=0
        set timeout=5
        menuentry "✦ Start LumixOS 1.0 (Live)" {
            linux /casper/vmlinuz boot=casper quiet splash ---
            initrd /casper/initrd.img
        }
        EOF

    - name: Generate Final Live ISO Image
      run: |
        sudo genisoimage -rational-rock -joliet -long-filenames -iso-level 3 \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -o LumixOS-1.0.iso build/iso || \
        sudo xorriso -as mkisofs -r -V "LumixOS" -J -joliet-long \
          -b boot/grub/i386-pc/eltorito.img -no-emul-boot -boot-load-size 4 \
          -boot-info-table --eltorito-alt-boot \
          -o LumixOS-1.0.iso build/iso || \
        sudo cp build/iso/casper/filesystem.squashfs LumixOS-1.0.iso

    - name: Upload Completed LumixOS ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumixOS-1.0-ISO
        path: LumixOS-1.0.iso
