name: Build LumixOS ISO
name: Build LumixOS ISO (Universal Edition)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install All Essential ISO Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso genisoimage mtools \
          isolinux syslinux syslinux-common syslinux-utils \
          grub-pc-bin grub-efi-amd64-bin ubuntu-keyring wget zenity curl git

    - name: Create Base RootFS Architecture (i386 Core for v86 & Real PCs)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --no-check-gpg jammy build/rootfs http://archive.ubuntu.com/ubuntu/

    - name: Install Kernel, Desktop Features, Games, and Custom Tools
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # ==========================================
        # 1. تثبيت النواة والواجهة والبرامج والألعاب
        # ==========================================
        apt-get install -y linux-image-generic casper xorg xfce4 xfce4-goodies lightdm \
          plank papirus-icon-theme arc-theme firefox git wget curl zenity \
          aisleriot gnome-mines gnome-sudoku pingus python3

        # ==========================================
        # 2. تخصيص هوية النظام (LumixOS Identity)
        # ==========================================
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0 (Universal Edition)"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0 (v86 & Real PC)"
        RELEASE

        # ==========================================
        # 3. إعداد التشغيل التلقائي لشريط macOS (Plank)
        # ==========================================
        mkdir -p /etc/skel/.config/autostart/
        cat << 'AUTOSTART' > /etc/skel/.config/autostart/plank.desktop
        [Desktop Entry]
        Type=Application
        Exec=plank
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Plank Dock
        AUTOSTART

        # ==========================================
        # 4. بناء وإنشاء أداة الترحيب (Lumix Welcome Center)
        # ==========================================
        mkdir -p /usr/local/bin/
        cat << 'APPINSTALLER' > /usr/local/bin/lumix-welcome
        #!/bin/bash
        zenity --info --title="LumixOS 1.0" --text="مرحباً بك يا وسيم في نظام LumixOS الشامل!\nجميع الميزات، الشريط، والألعاب مثبتة ومجهزة بنجاح." --width=400
        APPINSTALLER
        chmod +x /usr/local/bin/lumix-welcome

        cat << 'AUTOSTART_WELCOME' > /etc/skel/.config/autostart/lumix-welcome.desktop
        [Desktop Entry]
        Type=Application
        Exec=/usr/local/bin/lumix-welcome
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Lumix Welcome Center
        AUTOSTART_WELCOME

        # ==========================================
        # 5. ضبط مظهر Arc-Dark وأيقونات Papirus-Dark
        # ==========================================
        mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        cat << 'XSETTINGS' > /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <channel name="xsettings" version="1.0">
          <property name="Net" type="empty">
            <property name="ThemeName" type="string" value="Arc-Dark"/>
            <property name="IconThemeName" type="string" value="Papirus-Dark"/>
          </property>
        </channel>
        XSETTINGS

        apt-get clean
        EOF

        sudo umount -l build/rootfs/dev
        sudo umount -l build/rootfs/proc
        sudo umount -l build/rootfs/sys

    - name: Extract Kernel and Prepare ISO Directory Structure
      run: |
        mkdir -p build/iso/casper
        mkdir -p build/iso/boot/grub
        mkdir -p build/iso/isolinux

        # استخراج ملفات النواة إلى casper
        K_FILE=$(sudo find build/rootfs/boot/ /boot/ -type f -name "vmlinuz*" 2>/dev/null | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ /boot/ -type f -name "initrd*" 2>/dev/null | head -n 1)

        sudo cp -L "$K_FILE" build/iso/casper/vmlinuz
        sudo cp -L "$I_FILE" build/iso/casper/initrd.img

        # ضغط بيئة النظام إلى filesystem.squashfs
        sudo mksquashfs build/rootfs build/iso/casper/filesystem.squashfs -comp xz

        # نسخ كافة وحدات وإعدادات ISOLINUX/SYSLINUX لـ v86
        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true
        sudo cp /usr/lib/syslinux/bios/*.c32 build/iso/isolinux/ || true

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 30

        LABEL lumix
          KERNEL /casper/vmlinuz
          APPEND initrd=/casper/initrd.img boot=casper quiet splash ---
        EOF

        # إعداد قائمة GRUB للأجهزة الحقيقية
        cat << 'EOF' | sudo tee build/iso/boot/grub/grub.cfg
        set default=0
        set timeout=5

        menuentry "✦ Start LumixOS 1.0 (Live)" {
            linux /casper/vmlinuz boot=casper quiet splash ---
            initrd /casper/initrd.img
        }
        EOF

    - name: Generate Universal Bootable ISO
      run: |
        sudo xorriso -as mkisofs -r -V "LumixOS" -J -joliet-long \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -o LumixOS-1.0.iso build/iso

    - name: Upload Completed LumixOS ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumixOS-1.0-ISO
        path: LumixOS-1.0.iso
