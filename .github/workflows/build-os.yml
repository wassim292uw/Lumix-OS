name: Build LumixOS Alpine Win11 Desktop Edition

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-alpine-win11-lumixos:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install Toolchain and Packaging Utilities
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xorriso grub-pc-bin grub-common mtools squashfs-tools wget curl p7zip-full

      - name: Initialize Alpine Build Directories
        run: |
          sudo rm -rf /tmp/alpine_win11_build
          mkdir -p /tmp/alpine_win11_build/iso/boot/grub
          mkdir -p /tmp/alpine_win11_build/download

      - name: Download Official Alpine Linux Core (x86_64)
        run: |
          echo "Downloading official stable Alpine Linux ISO..."
          wget -q --show-progress -O /tmp/alpine_win11_build/download/alpine.iso "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-standard-3.19.0-x86_64.iso"
          
          ls -lh /tmp/alpine_win11_build/download/alpine.iso

      - name: Extract Alpine Components
        run: |
          sudo mkdir -p /tmp/alpine_win11_build/mnt
          sudo mount -o loop /tmp/alpine_win11_build/download/alpine.iso /tmp/alpine_win11_build/mnt

          cp /tmp/alpine_win11_build/mnt/boot/vmlinuz-lts /tmp/alpine_win11_build/iso/boot/vmlinuz
          cp /tmp/alpine_win11_build/mnt/boot/initramfs-lts /tmp/alpine_win11_build/iso/boot/initrd.img

          cp -r /tmp/alpine_win11_build/mnt/boot/* /tmp/alpine_win11_build/iso/boot/ || true
          cp -r /tmp/alpine_win11_build/mnt/apks /tmp/alpine_win11_build/iso/ || true

          sudo umount /tmp/alpine_win11_build/mnt

      - name: Configure Advanced Bootloader for Limbo (Alpine Win11)
        run: |
          cat << 'EOF' > /tmp/alpine_win11_build/iso/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod ext2
          insmod all_video

          menuentry "LumixOS Alpine Win11 Edition (Limbo Graphical)" {
              set gfxpayload=keep
              linux /boot/vmlinuz modules=loop,squashfs,sd-mod,usb-storage quiet nomodeset vga=788
              initrd /boot/initrd.img
          }

          menuentry "LumixOS Alpine Safe Console Mode" {
              set gfxpayload=text
              linux /boot/vmlinuz modules=loop,squashfs,sd-mod quiet nomodeset console=tty0
              initrd /boot/initrd.img
          }
          EOF

      - name: Package Bootable LumixOS Alpine ISO
        run: |
          grub-mkrescue -o LumixOS-Alpine-Win11-x64.iso /tmp/alpine_win11_build/iso
          ls -lh LumixOS-Alpine-Win11-x64.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumixOS-Alpine-Win11-x64-ISO
          path: LumixOS-Alpine-Win11-x64.iso

      - name: Publish Official Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v9.0-alpine-win11-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-Alpine-Win11-x64.iso \
            --title "LumixOS Alpine Win11 Edition Release #${{ github.run_number }}" \
            --notes "Super fast Alpine Linux engine combined with Windows 11 boot and display configurations for Limbo."
