name: Build LumixOS 1GB Full Feature Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools genisoimage isolinux syslinux-common syslinux-utils \
          curl git gh

    - name: Create Full 1GB Debian RootFS
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install Complete System Packages & Setup Wizard
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        set -e
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        echo "COMPRESS=gzip" >> /etc/initramfs-tools/initramfs.conf

        # تثبيت النواة وكافة الحزم الأساسية والأدوات
        apt-get install -y \
          systemd-sysv init linux-image-686-pae live-boot live-boot-initramfs-tools \
          whiptail python3 python3-pip sudo locales tzdata nano curl wget \
          pciutils usbutils kmod udev procps net-tools iputils-ping \
          firmware-linux firmware-misc-nonfree btrfs-progs xfsprogs e2fsprogs

        systemctl mask systemd-networkd-wait-online.service || true
        systemctl mask Networking.service || true
        systemctl mask systemd-udev-settle.service || true

        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # برنامج الترحب الخاص بـ وسيم
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        NAME_FILE="$CONFIG_DIR/username"

        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(whiptail --title "LumixOS Professional Setup" --inputbox "Welcome WASSIM to LumixOS Full Edition!\nEnter your name:" 10 50 "WASSIM" 3>&1 1>&2 2>&3)
            if [ -z "$U_NAME" ]; then U_NAME="WASSIM"; fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        USER_NAME=$(cat "$NAME_FILE")
        whiptail --msgbox "Welcome $USER_NAME!\nLumixOS Full 1GB System is ready!" 10 50
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        echo "/usr/local/bin/lumix-setup" >> /home/user/.bashrc
        chown -R user:sudo /home/user

        mkdir -p /etc/systemd/system/getty@tty1.service.d/
        cat << 'GETTY' > /etc/systemd/system/getty@tty1.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
        GETTY

        echo "lumixos" > /etc/hostname
        apt-get clean
        rm -rf /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare ISO Structure
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        # البحث التلقائي الدقيق عن ملفات النواة
        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 128k

        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 10

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live username=user console=tty1 nomodeset noapic nolapic
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Full 1GB ISO
      run: |
        genisoimage -R -J \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -o LumixOS-Full-1GB.iso build/iso

    - name: Release Full 1GB ISO
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-full-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-Full-1GB.iso --title "LumixOS 1.0 Full 1GB Feature Release" --notes "نسخة كاملة وضخمة تحتوي على كافة ملفات وحزم نظام دبيان بحجم يقارب 1GB."
