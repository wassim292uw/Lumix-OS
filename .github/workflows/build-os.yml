name: Build Zorin-Style LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-common xorriso mtools

      - name: Create Base System
        run: |
          mkdir -p build/rootfs
          sudo debootstrap --variant=minbase --arch=i386 bookworm build/rootfs http://deb.debian.org/debian/

      - name: Configure Zorin-Style Fast System
        run: |
          sudo mount --bind /dev build/rootfs/dev
          sudo mount --bind /proc build/rootfs/proc
          sudo mount --bind /sys build/rootfs/sys

          cat << 'EOF' | sudo chroot build/rootfs /bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive

          cat << 'SOURCES' > /etc/apt/sources.list
          deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware
          SOURCES

          apt-get update
          apt-get install -y --no-install-recommends \
            systemd-sysv init linux-image-686-pae live-boot live-boot-initramfs-tools \
            sudo nano bash-completion htop neofetch

          # Optimize system size
          rm -rf /usr/share/doc/* /usr/share/man/*
          apt-get clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*

          # Configure User & Zorin-like Hostname
          useradd -m -s /bin/bash -g sudo user
          passwd -d user
          echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          echo "zorin-lumixos" > /etc/hostname

          # Enable Autologin
          mkdir -p /etc/systemd/system/getty@tty1.service.d/
          cat << 'GETTY' > /etc/systemd/system/getty@tty1.service.d/override.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
          GETTY

          # Add Custom Zorin-style welcome prompt
          cat << 'WELCOME' >> /home/user/.bashrc
          clear
          echo "========================================================"
          echo "       Welcome to LumixOS (Zorin-Style Express)         "
          echo "========================================================"
          echo "  Fast & Optimized for Limbo x86 Emulator!              "
          echo "========================================================"
          neofetch || true
          WELCOME
          chown user:sudo /home/user/.bashrc

          EOF

          sudo umount -f build/rootfs/dev || true
          sudo umount -f build/rootfs/proc || true
          sudo umount -f build/rootfs/sys || true

      - name: Build Final ISO
        run: |
          mkdir -p build/iso/boot/grub
          mkdir -p build/iso/live

          K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
          I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

          sudo cp -L "$K_FILE" build/iso/live/vmlinuz
          sudo cp -L "$I_FILE" build/iso/live/initrd.img

          sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 256k

          cat << 'EOF' > build/iso/boot/grub/grub.cfg
          set timeout=1
          set default=0
          set gfxpayload=800x600

          menuentry "LumixOS (Zorin Express Boot)" {
              linux /live/vmlinuz boot=live nomodeset noapic nolapic nowatchdog nmi_watchdog=0 tsc=reliable clocksource=hpet
              initrd /live/initrd.img
          }
          EOF

          sudo chmod -R 777 build/iso
          grub-mkrescue -o LumixOS-ZorinEdition.iso build/iso

      - name: Release LumixOS Zorin ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-zorin-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-ZorinEdition.iso --title "LumixOS Zorin Express Edition" --notes "Super fast Zorin-style ISO built for Limbo"
