name: Build LumixOS Raw Disk Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools dosfstools mtools syslinux syslinux-common \
          extlinux e2fsprogs parted zenity curl git gh

    - name: Create Complete RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install System Features & User Setup
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة وجميع تعريفات الشاشة الأساسية لمنع التعليق
        apt-get install -y --no-install-recommends \
          linux-image-686 xserver-xorg-core xserver-xorg xserver-xorg-video-all xinit openbox nodm sudo \
          plank zenity python3 netsurf-gtk grub-pc-bin extlinux

        # 2. إنشاء المستخدم بدون كلمة سر نهائياً
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. أداة الترحيب وإعداد الاسم باسم وسيم
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        NAME_FILE="$HOME/.config/lumix_username"

        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(zenity --entry --title="LumixOS Welcome" --text="أهلاً بك في نظام LumixOS!\nرجاءً أدخل اسمك لتخصيص النظام:" --entry-text="وسيم" --width=380)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            mkdir -p "$HOME/.config/"
            echo "$U_NAME" > "$NAME_FILE"
        fi

        USER_NAME=$(cat "$NAME_FILE")
        zenity --info --title="LumixOS 1.0" --text="مرحباً بك يا $USER_NAME في بيئتك الخاصة!" --width=400
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. التشغيل التلقائي للشريط والأداة
        mkdir -p /home/user/.config/openbox/
        mkdir -p /etc/skel/.config/openbox/
        cat << 'AUTO' > /home/user/.config/openbox/autostart
        plank &
        /usr/local/bin/lumix-setup &
        AUTO
        cp /home/user/.config/openbox/autostart /etc/skel/.config/openbox/

        chown -R user:sudo /home/user

        # 5. تفعيل الدخول المباشر بدون كلمة سر عبر nodm
        cat << 'NODM' > /etc/default/nodm
        NODM_ENABLED=true
        NODM_USER=user
        NODM_XSESSION=/etc/X11/Xsession
        NODM_MIN_SESSION_TIME=60
        NODM_X_OPTIONS='-nolisten tcp'
        NODM_FIRST_VT=7
        NODM_XPanal=
        NODM

        # 6. ضبط هوية النظام واسمه الرسمي
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Package as Raw Disk Image (IMG) for Limbo
      run: |
        # إنشاء ملف قرص صلب حقيقي بحجم كافي ومستقر (2 جيجابايت)
        dd if=/dev/zero of=LumixOS-1.0.img bs=1M count=2048
        sudo mkfs.ext4 -F LumixOS-1.0.img

        mkdir -p mnt
        sudo mount -o loop LumixOS-1.0.img mnt
        sudo cp -a build/rootfs/* mnt/

        # تثبيت إعدادات الإقلاع البسيطة داخل القرص
        sudo mkdir -p mnt/boot/extlinux
        K_FILE=$(ls mnt/boot/ | grep vmlinuz | head -n 1)
        I_FILE=$(ls mnt/boot/ | grep initrd | head -n 1)

        cat << 'EOF' | sudo tee mnt/boot/extlinux/extlinux.conf
        DEFAULT lumix
        TIMEOUT 10
        PROMPT 0

        LABEL lumix
            KERNEL /boot/$K_FILE
            INITRD /boot/$I_FILE
            APPEND root=/dev/sda rw rootfstype=ext4 nomodeset quiet splash
        EOF

        # تثبيت القطاع الرئيسي للإقلاع
        sudo extlinux --install mnt/boot/extlinux
        sync
        sudo umount mnt

    - name: Direct IMG Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.img --title "LumixOS 1.0 Raw Disk Release" --notes "ملف قرص صلب IMG مباشر ومخصص ليعمل بدون تعليق في Limbo."
