name: Build LumixOS Win11 Edition from Tiny Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-tinycore-lumixos:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install ISO & Packaging Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xorriso grub-pc-bin grub-common mtools squashfs-tools p7zip-full wget

      - name: Prepare Workspace Directories
        run: |
          sudo rm -rf /tmp/tiny_build
          mkdir -p /tmp/tiny_build/iso/boot/grub
          mkdir -p /tmp/tiny_build/extracted
          mkdir -p /tmp/tiny_build/download
          mkdir -p /tmp/tiny_build/custom_overlay/home/tc/.config

      - name: Download Official Tiny Core ISO Automatically
        run: |
          echo "Downloading official Tiny Core ISO..."
          wget -q --show-progress -O /tmp/tiny_build/download/tinycore.iso "http://tinycorelinux.net/15.x/x86/release/CorePlus-current.iso"
          
          echo "Extracting Tiny Core ISO components..."
          7z x /tmp/tiny_build/download/tinycore.iso -o/tmp/tiny_build/extracted/
          cp -r /tmp/tiny_build/extracted/* /tmp/tiny_build/iso/

      - name: Inject Custom Win11 Features, Branding & Layout
        run: |
          # 1. Custom System Hostname
          echo "lumixos-win11-tiny" > /tmp/tiny_build/custom_overlay/etc/hostname

          # 2. Custom Terminal Welcome Screen with Developer Branding
          cat << 'BASHEOF' > /tmp/tiny_build/custom_overlay/home/tc/.bashrc
          clear
          echo "================================================="
          echo "   Welcome to LumixOS Win11 (Tiny Core Engine)   "
          echo "================================================="
          echo " Developer: Waseem                               "
          echo " Status: Ultra Fast & Lightweight Win11 Active   "
          echo "================================================="
          BASHEOF

          # 3. Create Custom Win11 Taskbar Configuration
          mkdir -p /tmp/tiny_build/custom_overlay/home/tc/.config/lumixos
          cat << 'WIN11CONF' > /tmp/tiny_build/custom_overlay/home/tc/.config/lumixos/win11.conf
          TASKBAR_POSITION=bottom
          THEME_MODE=dark
          DEVELOPER=Waseem
          WIN11CONF

          # 4. Pack modifications into a Squashfs extension block
          mksquashfs /tmp/tiny_build/custom_overlay /tmp/tiny_build/iso/cde/optional/99-lumix-win11.tcz -comp xz

      - name: Configure Limbo Display Boot Options (GRUB Fixed)
        run: |
          sudo mkdir -p /tmp/tiny_build/iso/boot/grub
          sudo bash -c "cat << 'EOF' > /tmp/tiny_build/iso/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod ext2
          insmod all_video

          menuentry \"LumixOS Win11 Desktop (Tiny Core Engine)\" {
              set gfxpayload=800x600x16,800x600
              linux /boot/vmlinuz quiet nomodeset tce=hd0/sde1
              initrd /boot/core.gz
          }

          menuentry \"LumixOS Safe Console Mode\" {
              set gfxpayload=text
              linux /boot/vmlinuz nomodeset console=tty0
              initrd /boot/core.gz
          }
          EOF"

      - name: Build Final LumixOS ISO
        run: |
          sudo grub-mkrescue -o LumixOS-Win11-TinyCore.iso /tmp/tiny_build/iso
          ls -lh LumixOS-Win11-TinyCore.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumixOS-Win11-TinyCore-ISO
          path: LumixOS-Win11-TinyCore.iso

      - name: Publish Official GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v16.0-tinycore-win11-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-Win11-TinyCore.iso \
            --title "LumixOS Win11 TinyCore Release #${{ github.run_number }}" \
            --notes "Custom LumixOS built on Tiny Core engine with Windows 11 layout features, instant download, and optimized GRUB payload for Limbo."
