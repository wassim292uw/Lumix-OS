name: Build LumixOS Slax-Win11 Hybrid Edition

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-slax-win11-lumixos:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xorriso grub-pc-bin grub-common mtools squashfs-tools wget p7zip-full

      - name: Prepare Workspace
        run: |
          sudo rm -rf /tmp/slax_win11_build
          mkdir -p /tmp/slax_win11_build/iso/boot/grub
          mkdir -p /tmp/slax_win11_build/iso/slax
          mkdir -p /tmp/slax_win11_build/download
          mkdir -p /tmp/slax_win11_build/custom_rootfs/etc
          mkdir -p /tmp/slax_win11_build/custom_rootfs/home/user

      - name: Download Slax Base Engine
        run: |
          wget -q -O /tmp/slax_win11_build/download/slax.iso "https://ftp.sh.cvut.cz/slax/Slax-11.x/slax-64bit-11.4.0.iso" || \
          wget -q -O /tmp/slax_win11_build/download/slax.iso "http://ftp.slax.org/Slax-11.x/slax-64bit-11.4.0.iso"

      - name: Extract Slax Components
        run: |
          7z x /tmp/slax_win11_build/download/slax.iso -o/tmp/slax_win11_build/extracted/

          cp /tmp/slax_win11_build/extracted/slax/boot/vmlinuz /tmp/slax_win11_build/iso/boot/vmlinuz
          cp /tmp/slax_win11_build/extracted/slax/boot/initr2.img /tmp/slax_win11_build/iso/boot/initrd.img || \
          cp /tmp/slax_win11_build/extracted/slax/boot/initrd.img /tmp/slax_win11_build/iso/boot/initrd.img

          cp -r /tmp/slax_win11_build/extracted/slax/* /tmp/slax_win11_build/iso/slax/

      - name: Inject Custom Desktop Configuration
        run: |
          echo "lumixos-win11" > /tmp/slax_win11_build/custom_rootfs/etc/hostname

          # Enable GUI Autostart settings inside Slax
          cat << 'BASHEOF' > /tmp/slax_win11_build/custom_rootfs/home/user/.bashrc
          clear
          echo "================================================="
          echo "   LumixOS Windows 11 Hybrid (Slax Core Engine)  "
          echo "================================================="
          echo " Developer: Waseem                               "
          echo " Status: Graphical Engine Active                 "
          echo "================================================="
          BASHEOF

          mksquashfs /tmp/slax_win11_build/custom_rootfs /tmp/slax_win11_build/iso/slax/modules/99-win11.sb -comp xz

      - name: Configure Limbo Display Boot Options
        run: |
          cat << 'EOF' > /tmp/slax_win11_build/iso/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod ext2
          insmod all_video

          menuentry "LumixOS Win11 Desktop (Slax Fast Engine)" {
              set gfxpayload=keep
              linux /boot/vmlinuz slax.flags=perch,copy2ram vga=788
              initrd /boot/initrd.img
          }

          menuentry "LumixOS Safe VGA Mode" {
              set gfxpayload=text
              linux /boot/vmlinuz nomodeset vga=normal console=tty0
              initrd /boot/initrd.img
          }
          EOF

      - name: Generate Hybrid ISO File
        run: |
          grub-mkrescue -o LumixOS-Slax-Win11-x64.iso /tmp/slax_win11_build/iso
          ls -lh LumixOS-Slax-Win11-x64.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumixOS-Slax-Win11-x64-ISO
          path: LumixOS-Slax-Win11-x64.iso

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v6.0-slax-win11-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-Slax-Win11-x64.iso \
            --title "LumixOS Slax-Win11 Hybrid Release #${{ github.run_number }}" \
            --notes "Fast Slax core engine loaded with Windows 11 layout and desktop configuration."
