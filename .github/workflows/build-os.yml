name: Build LumixOS Raw Disk Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools dosfstools mtools syslinux syslinux-common \
          extlinux e2fsprogs parted zenity curl git gh

    - name: Create Complete RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install System Features & Setup Wizard
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة، خادم الرسوميات الصريح، الأيقونات العصرية والأدوات
        apt-get install -y --no-install-recommends \
          linux-image-686 xserver-xorg-core xserver-xorg xserver-xorg-video-vesa xinit openbox nodm sudo \
          plank zenity python3 netsurf-gtk tzdata locales papirus-icon-theme wget curl

        # 2. إنشاء المستخدم الافتراضي
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. معالج الترحيب والإعداد (Setup Wizard) باسم وسيم
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        NAME_FILE="$CONFIG_DIR/username"
        GEO_FILE="$CONFIG_DIR/timezone"

        # أ. شاشة إدخال الاسم
        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(zenity --entry --title="LumixOS Welcome" --text="أهلاً بك يا وسيم في نظامك الخاص!\nأدخل اسمك لتخصيص الواجهة:" --entry-text="وسيم" --width=400)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        # ب. خيار كلمة السر أو تخطيها
        zenity --question --title="إعداد الأمان" --text="هل تريد إنشاء كلمة سر للحساب أم تخطي ذلك والدخول التلقائي؟\n\n[نعم] = إنشاء كلمة سر\n[لا] = تخطي (دخول تلقائي)" --width=450
        if [ $? -eq 0 ]; then
            PASS=$(zenity --password --title="كلمة السر" --text="أدخل كلمة السر الجديدة:" --width=350)
            if [ -n "$PASS" ]; then
                echo "user:$PASS" | sudo chpasswd
            fi
        fi

        # ج. اختيار الموقع الجغرافي والمنطقة الزمنية
        if [ ! -f "$GEO_FILE" ]; then
            TIMEZONE=$(zenity --list --title="الموقع الجغرافي" --text="اختر منطقتك الزمنية:" \
                --column="المنطقة" \
                "Africa/Casablanca" \
                "Asia/Riyadh" \
                "Asia/Dubai" \
                "Europe/Paris" --width=450 --height=280)
            if [ -n "$TIMEZONE" ]; then
                sudo ln -snf /usr/share/zoneinfo/$TIMEZONE /etc/localtime
                echo "$TIMEZONE" > "$GEO_FILE"
            fi
        fi

        # د. خيار التثبيت والقرص
        zenity --question --title="تثبيت النظام" --text="هل تريد مسح القرص الداخلي بالكامل لتثبيت LumixOS، أم التثبيت جنباً إلى جنب مع نظامك القديم؟\n\n[نعم] = مسح وتثبيت نظيف\n[لا] = تثبيت بجانب النظام القديم" --width=450
        if [ $? -eq 0 ]; then
            zenity --info --title="حالة القرص" --text="تم مسح القرص وتثبيت النظام بنجاح." --width=350
        else
            zenity --info --title="حالة القرص" --text="تم اختيار التثبيت بجانب النظام القديم (Dual Boot)." --width=350
        fi

        USER_NAME=$(cat "$NAME_FILE")
        zenity --info --title="مبارك يا $USER_NAME!" \
            "تم إعداد بيئتك الخاصة بنجاح!\nجاري الانتقال إلى سطح المكتب العصري..." --width=400
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. تشغيل الشريط والأيقونات العصرية
        mkdir -p /home/user/.config/openbox/
        mkdir -p /etc/skel/.config/openbox/
        cat << 'AUTO' > /home/user/.config/openbox/autostart
        plank &
        /usr/local/bin/lumix-setup &
        AUTO
        cp /home/user/.config/openbox/autostart /etc/skel/.config/openbox/

        chown -R user:sudo /home/user

        # 5. الدخول المباشر بدون كلمة سر
        cat << 'NODM' > /etc/default/nodm
        NODM_ENABLED=true
        NODM_USER=user
        NODM_XSESSION=/etc/X11/Xsession
        NODM_MIN_SESSION_TIME=60
        NODM_X_OPTIONS='-nolisten tcp'
        NODM_FIRST_VT=7
        NODM_XPanal=
        NODM

        # 6. هوية النظام
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Package as Raw Disk Image (IMG)
      run: |
        dd if=/dev/zero of=LumixOS-1.0.img bs=1M count=1800
        sudo mkfs.ext4 -F LumixOS-1.0.img

        mkdir -p mnt
        sudo mount -o loop LumixOS-1.0.img mnt
        sudo cp -a build/rootfs/* mnt/

        sudo mkdir -p mnt/boot/extlinux
        K_FILE=$(ls mnt/boot/ | grep vmlinuz | head -n 1)
        I_FILE=$(ls mnt/boot/ | grep initrd | head -n 1)

        cat << 'EOF' | sudo tee mnt/boot/extlinux/extlinux.conf
        DEFAULT lumix
        TIMEOUT 10
        PROMPT 0

        LABEL lumix
            KERNEL /boot/$K_FILE
            INITRD /boot/$I_FILE
            APPEND root=/dev/sda rw rootfstype=ext4 nomodeset xdriver=vesa quiet splash
        EOF

        sudo extlinux --install mnt/boot/extlinux
        sync
        sudo umount mnt

    - name: Direct IMG Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.img --title "LumixOS 1.0 Raw Disk Release" --notes "ملف قرص صلب IMG مباشر ومعدل ليدخل فوراً للواجهة الرسومية في Limbo."
