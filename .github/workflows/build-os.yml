name: Build LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso genisoimage isolinux syslinux-common syslinux-utils \
          wget zenity curl git

    - name: Create Base RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install Lightweight Desktop and Setup User Wassim
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة والواجهة الخفيفة جداً
        apt-get install -y --no-install-recommends \
          linux-image-686 live-boot xorg openbox xterm lightdm sudo \
          plank papirus-icon-theme arc-theme zenity python3 netsurf-gtk

        # 2. إنشاء المستخدم باسم وسيم وتفعيله كمسؤول
        useradd -m -s /bin/bash -g sudo wassim
        echo "wassim:1234" | chpasswd
        echo "wassim ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. ضبط هوية LumixOS
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0 (Wassim Edition)"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        # 4. إعداد التشغيل التلقائي
        mkdir -p /home/wassim/.config/openbox/
        cat << 'AUTO' > /home/wassim/.config/openbox/autostart
        plank &
        lumix-welcome &
        AUTO

        # 5. أداة الترحيب المخصصة باسم وسيم
        mkdir -p /usr/local/bin/
        cat << 'APP' > /usr/local/bin/lumix-welcome
        #!/bin/bash
        zenity --info --title="LumixOS 1.0" --text="أهلاً وسهلاً بك يا وسيم!\nنظام LumixOS خفيف وسريع ومخصص لك بنجاح." --width=350
        APP
        chmod +x /usr/local/bin/lumix-welcome

        # تصحيح الملكية
        chown -R wassim:sudo /home/wassim

        # 6. الدخول التلقائي بالنظام باسم wassim
        mkdir -p /etc/lightdm/lightdm.conf.d/
        cat << 'LIGHTDM' > /etc/lightdm/lightdm.conf.d/autologin.conf
        [Seat:*]
        autologin-user=wassim
        autologin-user-timeout=0
        LIGHTDM

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -l build/rootfs/dev
        sudo umount -l build/rootfs/proc
        sudo umount -l build/rootfs/sys

    - name: Prepare ISO Directory Structure
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        # ضغط خفيف وحجم صغير جداً
        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 128k

        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true
        sudo cp /usr/lib/syslinux/bios/*.c32 build/iso/isolinux/ || true

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 10

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live username=wassim quiet splash ---
        EOF

    - name: Generate ISO Image
      run: |
        genisoimage -logical-core-segment -cache-inodes -J -l -r \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -output LumixOS-1.0.iso build/iso

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumixOS-1.0-ISO
        path: LumixOS-1.0.iso
