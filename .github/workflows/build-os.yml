name: Build LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools \
          isolinux syslinux-utils ubuntu-keyring wget zenity

    - name: Create Base RootFS
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=amd64 --no-check-gpg jammy build/rootfs http://archive.ubuntu.com/ubuntu/ || true

    - name: Configure and Customize LumixOS RootFS
      run: |
        sudo mount --bind /dev build/rootfs/dev || true
        sudo mount --bind /proc build/rootfs/proc || true
        sudo mount --bind /sys build/rootfs/sys || true

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash || true
        export DEBIAN_FRONTEND=noninteractive
        apt-get update --fix-missing || true

        # 1. تحميل وتثبيت النواة المباشرة الرسمية والواجهة
        apt-get install -y --no-install-recommends \
          linux-image-generic casper xorg xfce4 lightdm firefox \
          plank papirus-icon-theme arc-theme \
          wget curl zenity python3 || true

        # 2. تخصيص هوية LumixOS
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0 (Next-Gen Edition)"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        # 3. تفعيل شريط macOS Dock (Plank)
        mkdir -p /etc/skel/.config/autostart/
        cat << 'AUTOSTART' > /etc/skel/.config/autostart/plank.desktop
        [Desktop Entry]
        Type=Application
        Exec=plank
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Plank Dock
        AUTOSTART

        # 4. أداة الترحيب Lumix Welcome Center
        mkdir -p /usr/local/bin/
        cat << 'APPINSTALLER' > /usr/local/bin/lumix-welcome
        #!/bin/bash
        zenity --info --title="LumixOS 1.0" --text="أهلاً بك في نظام LumixOS!" --width=300 || true
        APPINSTALLER
        chmod +x /usr/local/bin/lumix-welcome || true

        cat << 'AUTOSTART_WELCOME' > /etc/skel/.config/autostart/lumix-welcome.desktop
        [Desktop Entry]
        Type=Application
        Exec=/usr/local/bin/lumix-welcome
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Lumix Welcome Center
        AUTOSTART_WELCOME

        # 5. تطبيق المظهر والأيقونات
        mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        cat << 'XSETTINGS' > /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <channel name="xsettings" version="1.0">
          <property name="Net" type="empty">
            <property name="ThemeName" type="string" value="Arc-Dark"/>
            <property name="IconThemeName" type="string" value="Papirus-Dark"/>
          </property>
        </channel>
        XSETTINGS

        apt-get clean
        EOF

        sudo umount -l build/rootfs/dev || true
        sudo umount -l build/rootfs/proc || true
        sudo umount -l build/rootfs/sys || true

    - name: Pack RootFS and Auto-Inject Kernel
      run: |
        mkdir -p build/iso/casper
        sudo mksquashfs build/rootfs build/iso/casper/filesystem.squashfs -comp xz

        # البحث عن ملف النواة المحمل ونسخه تلقائياً لـ casper بأسماء حقيقية ومستقرة
        K_FILE=$(find build/rootfs/boot/ -type f -name "vmlinuz-*" 2>/dev/null | head -n 1)
        I_FILE=$(find build/rootfs/boot/ -type f -name "initrd.img-*" 2>/dev/null | head -n 1)

        if [ -f "$K_FILE" ]; then
          sudo cp -L "$K_FILE" build/iso/casper/vmlinuz
        else
          sudo cp -L /boot/vmlinuz build/iso/casper/vmlinuz
        fi

        if [ -f "$I_FILE" ]; then
          sudo cp -L "$I_FILE" build/iso/casper/initrd.img
        else
          sudo cp -L /boot/initrd.img build/iso/casper/initrd.img
        fi

    - name: Create Safe GRUB Boot Menu for LumixOS
      run: |
        mkdir -p build/iso/boot/grub
        cat << 'EOF' > build/iso/boot/grub/grub.cfg
        set default=0
        set timeout=10

        insmod all_video
        insmod gfxterm

        menuentry "✦ Start LumixOS 1.0 (Live Environment)" {
            linux /casper/vmlinuz boot=casper quiet splash ---
            initrd /casper/initrd.img
        }

        menuentry "✦ LumixOS Safe Graphics Mode" {
            linux /casper/vmlinuz boot=casper nomodeset ---
            initrd /casper/initrd.img
        }
        EOF

    - name: Generate Final Live ISO Image
      run: |
        grub-mkrescue -o LumixOS-1.0.iso build/iso

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumixOS-1.0-ISO
        path: LumixOS-1.0.iso
