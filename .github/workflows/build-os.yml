name: Build LumixOS x64 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-common xorriso mtools

      - name: Build Rootfs with Debootstrap
        run: |
          sudo debootstrap --arch=amd64 bookworm /tmp/rootfs http://deb.debian.org/debian

      - name: Create ISO Image
        run: |
          mkdir -p /tmp/iso/boot/grub
          sudo cp -r /tmp/rootfs/boot/vmlinuz-* /tmp/iso/boot/vmlinuz 2>/dev/null || true
          sudo cp -r /tmp/rootfs/boot/initrd.img-* /tmp/iso/boot/initrd.img 2>/dev/null || true
          
          # Simple Grub Config for Limbo Compatibility
          cat << 'EOF' > /tmp/iso/boot/grub/grub.cfg
          set timeout=5
          set default=0
          menuentry "LumixOS (x64 Express Boot)" {
              search --no-floppy --fs-uuid --set=root $root
              linux /boot/vmlinuz boot=live nomodeset vga=normal console=tty0
              initrd /boot/initrd.img
          }
          EOF

          grub-mkrescue -o LumixOS-x64.iso /tmp/iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumixOS-x64-ISO
          path: LumixOS-x64.iso
