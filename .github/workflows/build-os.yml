name: Build LumixOS Fast Edition ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-common xorriso mtools

      - name: Create Base RootFS
        run: |
          mkdir -p build/rootfs
          sudo debootstrap --arch=i386 bookworm build/rootfs http://deb.debian.org/debian/

      - name: Configure Fast LumixOS System
        run: |
          sudo mount --bind /dev build/rootfs/dev
          sudo mount --bind /proc build/rootfs/proc
          sudo mount --bind /sys build/rootfs/sys

          cat << 'EOF' | sudo chroot build/rootfs /bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive

          cat << 'SOURCES' > /etc/apt/sources.list
          deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian/ bookworm-updates main contrib non-free non-free-firmware
          SOURCES

          apt-get update
          apt-get install -y \
            systemd-sysv init linux-image-686-pae live-boot live-boot-initramfs-tools \
            python3 sudo locales tzdata nano curl wget pciutils usbutils \
            dialog bash-completion htop

          # Boot options & watchdog disabling
          mkdir -p /etc/initramfs-tools
          echo "COMPRESS=gzip" > /etc/initramfs-tools/initramfs.conf
          systemctl mask systemd-networkd-wait-online.service || true
          systemctl mask Networking.service || true
          systemctl mask systemd-udev-settle.service || true

          # Create User
          useradd -m -s /bin/bash -g sudo user
          passwd -d user
          echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          # Create Custom Welcome Banner on Autologin
          echo "lumixos" > /etc/hostname
          
          # Custom TTY Autologin
          mkdir -p /etc/systemd/system/getty@tty1.service.d/
          cat << 'GETTY' > /etc/systemd/system/getty@tty1.service.d/override.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
          GETTY

          # Add Welcome Message for Wassim
          cat << 'WELCOME' >> /home/user/.bashrc
          clear
          echo "========================================================"
          echo "        Welcome WASSIM to LumixOS Fast Edition!        "
          echo "========================================================"
          echo "  System Loaded Successfully in Limbo Emulator!          "
          echo "  Type 'sudo htop' to view resources or start coding!    "
          echo "========================================================"
          echo ""
          WELCOME
          chown user:sudo /home/user/.bashrc

          apt-get clean
          rm -rf /tmp/* /var/tmp/*
          EOF

          sudo umount -f build/rootfs/dev || true
          sudo umount -f build/rootfs/proc || true
          sudo umount -f build/rootfs/sys || true

      - name: Prepare Fast GRUB ISO
        run: |
          mkdir -p build/iso/boot/grub
          mkdir -p build/iso/live

          K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
          I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

          sudo cp -L "$K_FILE" build/iso/live/vmlinuz
          sudo cp -L "$I_FILE" build/iso/live/initrd.img

          sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 256k

          cat << 'EOF' > build/iso/boot/grub/grub.cfg
          set timeout=2
          set default=0

          menuentry "LumixOS (Fast Express Boot)" {
              linux /live/vmlinuz boot=live nomodeset noapic nolapic nowatchdog nmi_watchdog=0 tsc=reliable clocksource=hpet quiet
              initrd /live/initrd.img
          }
          EOF

          sudo chmod -R 777 build/iso

      - name: Generate Final Fast ISO
        run: |
          grub-mkrescue -o LumixOS-Fast.iso build/iso

      - name: Release LumixOS Fast ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-fast-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-Fast.iso --title "LumixOS Fast Express Edition" --notes "High performance ultra-fast boot ISO for Limbo"
