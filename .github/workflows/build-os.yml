name: Build LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso isolinux syslinux-common syslinux-utils \
          zenity curl git gh

    - name: Create Complete RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install Full System Features & Setup User Environment
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة والواجهة الرسومية وشريط Plank والمتصفح
        apt-get install -y --no-install-recommends \
          linux-image-686 live-boot xserver-xorg-core xserver-xorg xinit openbox nodm sudo \
          plank zenity python3 netsurf-gtk wget curl

        # 2. إنشاء المستخدم الافتراضي بدون كلمة سر إطلاقاً (No Password)
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. أداة الإعداد التفاعلي (Setup Wizard) بترحيب خاص باسم وسيم
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        NAME_FILE="$HOME/.config/lumix_username"

        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(zenity --entry --title="LumixOS Welcome" --text="أهلاً بك في نظام LumixOS الرائع!\nرجاءً أدخل اسمك لضبط إعدادات النظام:" --entry-text="وسيم" --width=380)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            mkdir -p "$HOME/.config/"
            echo "$U_NAME" > "$NAME_FILE"
        fi

        USER_NAME=$(cat "$NAME_FILE")
        zenity --info --title="LumixOS 1.0" --text="مرحباً بك يا $USER_NAME في بيئتك الخاصة!\nنتمنى لك تجربة ممتعة وسريعة مع LumixOS." --width=400
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. تفعيل التشغيل التلقائي لشريط التطبيقات وأداة الترحيب
        mkdir -p /home/user/.config/openbox/
        mkdir -p /etc/skel/.config/openbox/
        cat << 'AUTO' > /home/user/.config/openbox/autostart
        plank &
        /usr/local/bin/lumix-setup &
        AUTO
        cp /home/user/.config/openbox/autostart /etc/skel/.config/openbox/

        chown -R user:sudo /home/user

        # 5. تفعيل الدخول المباشر بدون كلمة سر عبر nodm
        cat << 'NODM' > /etc/default/nodm
        NODM_ENABLED=true
        NODM_USER=user
        NODM_XSESSION=/etc/X11/Xsession
        NODM_MIN_SESSION_TIME=60
        NODM_X_OPTIONS='-nolisten tcp'
        NODM_FIRST_VT=7
        NODM_XPanal=
        NODM

        # 6. ضبط هوية النظام واسمه الرسمي
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare ISO Boot Structure
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        # ضغط RootFS
        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 128k

        # نسخ ملفات الإقلاع
        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true
        sudo cp /usr/lib/syslinux/bios/*.c32 build/iso/isolinux/ || true

        # ملف تهيئة الإقلاع المباشر بدون شاشات انتظار تعطل المحاكي
        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 10

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live username=user nomodeset vga=normal quiet splash ---
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Bootable Hybrid ISO via xorriso
      run: |
        # بناء ISO هجين متوافق 100% مع v86 ببرنامج xorriso القياسي
        sudo xorriso -as mkisofs \
          -iso-level 3 \
          -full-iso9660-filenames \
          -volid "LumixOS" \
          -b isolinux/isolinux.bin \
          -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
          -output LumixOS-1.0.iso build/iso

    - name: Direct ISO Release (No ZIP Compression)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.iso --title "LumixOS 1.0 ISO Direct Release" --notes "ملف ISO هجين مباشر جاهز للمحاكي v86 والأجهزة الحقيقية."
