name: Build Full LumixOS x64 Professional Distribution ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-professional-lumixos:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools grub-pc-bin grub-common \
            xorriso mtools dosfstools isolinux syslinux-utils wget curl git

      - name: Setup Build Directories
        run: |
          sudo rm -rf /tmp/lumix_pro_build
          mkdir -p /tmp/lumix_pro_build/rootfs
          mkdir -p /tmp/lumix_pro_build/iso/live
          mkdir -p /tmp/lumix_pro_build/iso/boot/grub

      - name: Bootstrap Base System
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=linux-image-amd64,live-boot,systemd-sysv,coreutils,bash,sudo,nano,iproute2,net-tools,procps,util-linux,udev,kbd,console-setup \
            bookworm \
            /tmp/lumix_pro_build/rootfs \
            http://deb.debian.org/debian

      - name: Configure System and Users
        run: |
          sudo mount --bind /dev /tmp/lumix_pro_build/rootfs/dev
          sudo mount --bind /proc /tmp/lumix_pro_build/rootfs/proc
          sudo mount --bind /sys /tmp/lumix_pro_build/rootfs/sys

          sudo chroot /tmp/lumix_pro_build/rootfs /bin/bash << 'CHROOT_EOF'
          export DEBIAN_FRONTEND=noninteractive
          echo "lumixos" > /etc/hostname
          echo "127.0.0.1 localhost lumixos" > /etc/hosts

          useradd -m -s /bin/bash user
          echo "user:user" | chpasswd
          echo "root:root" | chpasswd
          echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          cat << 'BASHEOF' >> /home/user/.bashrc
          clear
          echo "================================================="
          echo "        Welcome to LumixOS x64 Pro v1.0          "
          echo "================================================="
          echo " Developer: Waseem                               "
          echo " Status: Active Shell System                     "
          echo "================================================="
          BASHEOF

          chown -R user:user /home/user
          CHROOT_EOF

          sudo umount /tmp/lumix_pro_build/rootfs/dev || true
          sudo umount /tmp/lumix_pro_build/rootfs/proc || true
          sudo umount /tmp/lumix_pro_build/rootfs/sys || true

      - name: Extract Kernel and Initrd
        run: |
          KERNEL_FILE=$(ls -1 /tmp/lumix_pro_build/rootfs/boot/vmlinuz-* | head -n 1)
          INITRD_FILE=$(ls -1 /tmp/lumix_pro_build/rootfs/boot/initrd.img-* | head -n 1)

          sudo cp "$KERNEL_FILE" /tmp/lumix_pro_build/iso/live/vmlinuz
          sudo cp "$INITRD_FILE" /tmp/lumix_pro_build/iso/live/initrd.img

      - name: Create Squashfs
        run: |
          sudo mksquashfs \
            /tmp/lumix_pro_build/rootfs \
            /tmp/lumix_pro_build/iso/live/filesystem.squashfs \
            -comp xz -b 1024k -e boot -no-progress

      - name: Configure Optimized GRUB for Limbo Emulator
        run: |
          sudo mkdir -p /tmp/lumix_pro_build/iso/boot/grub
          sudo bash -c "cat << 'EOF' > /tmp/lumix_pro_build/iso/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod part_msdos
          insmod ext2
          insmod all_video

          menuentry \"LumixOS (Limbo Express Console)\" {
              set gfxpayload=text
              linux /live/vmlinuz boot=live quiet nomodeset console=tty0 console=ttyS0,115200n8 panic=10
              initrd /live/initrd.img
          }

          menuentry \"LumixOS (Limbo Safe Mode)\" {
              set gfxpayload=text
              linux /live/vmlinuz boot=live nomodeset xforcevesa console=tty0 single
              initrd /live/initrd.img
          }
          EOF"

      - name: Package ISO Image
        run: |
          sudo grub-mkrescue -o LumixOS-x64-Professional.iso /tmp/lumix_pro_build/iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumixOS-x64-Professional-ISO
          path: LumixOS-x64-Professional.iso

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.1-limbo-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-x64-Professional.iso \
            --title "LumixOS x64 Limbo Optimized Release #${{ github.run_number }}" \
            --notes "Optimized console video parameters for Limbo PC Emulator on Android."
