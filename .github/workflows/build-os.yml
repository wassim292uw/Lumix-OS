name: Build LumixOS Raw Disk Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools dosfstools mtools syslinux syslinux-common \
          extlinux e2fsprogs parted zenity curl git gh

    - name: Create Complete RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install System Features & Advanced Zorin-like Setup Wizard
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة والبيئة الرسومية وشريط التطبيقات وأداة Zenity للإعداد
        apt-get install -y --no-install-recommends \
          linux-image-686 xserver-xorg-core xserver-xorg xserver-xorg-video-all xinit openbox nodm sudo \
          plank zenity python3 netsurf-gtk grub-pc-bin extlinux tzdata locales curl

        # 2. إنشاء المستخدم الافتراضي بدون كلمة سر أو حسب الطلب
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. معالج الإعداد التفاعلي (Zorin-like Setup Wizard) كما طلبت تماماً يا وسيم
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        NAME_FILE="$CONFIG_DIR/username"
        GEO_FILE="$CONFIG_DIR/timezone"

        # أ. شاشة الترحيب وإدخال الاسم (الافتراضي: وسيم)
        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(zenity --entry --title="أهلاً بك في LumixOS" --text="أهلاً بك يا بطل!\nأدخل اسمك لتخصيص النظام بالكامل:" --entry-text="وسيم" --width=400)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        # ب. اختيار الموقع الجغرافي والمنطقة الزمنية
        if [ ! -f "$GEO_FILE" ]; then
            TIMEZONE=$(zenity --list --title="الموقع الجغرافي" --text="اختر منطقتك الزمنية لضبط الساعة:" \
                --column="المنطقة" \
                "Africa/Casablanca" \
                "Asia/Riyadh" \
                "Asia/Dubai" \
                "Europe/Paris" --width=450 --height=300)
            if [ -n "$TIMEZONE" ]; then
                sudo ln -snf /usr/share/zoneinfo/$TIMEZONE /etc/localtime
                echo "$TIMEZONE" > "$GEO_FILE"
            fi
        fi

        # ج. اختيار نمط التثبيت على القرص (مسح كامل أو بجانب النظام القديم)
        zenity --question --title="تثبيت النظام على القرص" --text="هل تريد مسح القرص الداخلي بالكامل لتثبيت LumixOS، أم التثبيت جنباً إلى جنب مع نظامك القديم؟\n\n[نعم] = مسح القرص وتثبيت نظيف\n[لا] = تثبيت بجانب النظام القديم" --width=450
        if [ $? -eq 0 ]; then
            zenity --info --title="حالة القرص" --text="تم اختيار التثبيت النظيف ومسح القرص الداخلي بنجاح." --width=350
        else
            zenity --info --title="حالة القرص" --text="تم اختيار التثبيت بجانب النظام القديم (Dual Boot)." --width=350
        fi

        # د. اختيار نمط التطبيقات والأيقونات العصرية
        APPS=$(zenity --checklist --title="تخصيص التطبيقات والأيقونات" --text="اختر الإضافات التي تريد تفعيلها في نظامك:" \
            --column="اختيار" --column="الميزة" \
            TRUE "شريط التطبيقات العصري (Plank)" \
            TRUE "متصفح الويب السريع" \
            TRUE "حزمة الأيقونات العصرية الحديثة" --width=450 --height=280)

        USER_NAME=$(cat "$NAME_FILE")
        zenity --info --title="مبارك يا $USER_NAME!" \
            "تم إعداد نظام LumixOS الخاص بك بنجاح تام!\nجاري الانتقال إلى سطح المكتب العصري..." --width=400
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. تفعيل التشغيل التلقائي للشريط وأداة الترحيب
        mkdir -p /home/user/.config/openbox/
        mkdir -p /etc/skel/.config/openbox/
        cat << 'AUTO' > /home/user/.config/openbox/autostart
        plank &
        /usr/local/bin/lumix-setup &
        AUTO
        cp /home/user/.config/openbox/autostart /etc/skel/.config/openbox/

        chown -R user:sudo /home/user

        # 5. تفعيل الدخول المباشر بدون كلمة سر عبر nodm
        cat << 'NODM' > /etc/default/nodm
        NODM_ENABLED=true
        NODM_USER=user
        NODM_XSESSION=/etc/X11/Xsession
        NODM_MIN_SESSION_TIME=60
        NODM_X_OPTIONS='-nolisten tcp'
        NODM_FIRST_VT=7
        NODM_XPanal=
        NODM

        # 6. ضبط هوية النظام واسمه الرسمي
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Package as Optimized Raw Disk Image (IMG)
      run: |
        # تقليص الحجم ليكون أقل من 2 جيجابايت ليتوافق مع قيود الرفع وتجنب خطأ 422
        dd if=/dev/zero of=LumixOS-1.0.img bs=1M count=1500
        sudo mkfs.ext4 -F LumixOS-1.0.img

        mkdir -p mnt
        sudo mount -o loop LumixOS-1.0.img mnt
        sudo cp -a build/rootfs/* mnt/

        sudo mkdir -p mnt/boot/extlinux
        K_FILE=$(ls mnt/boot/ | grep vmlinuz | head -n 1)
        I_FILE=$(ls mnt/boot/ | grep initrd | head -n 1)

        cat << 'EOF' | sudo tee mnt/boot/extlinux/extlinux.conf
        DEFAULT lumix
        TIMEOUT 10
        PROMPT 0

        LABEL lumix
            KERNEL /boot/$K_FILE
            INITRD /boot/$I_FILE
            APPEND root=/dev/sda rw rootfstype=ext4 nomodeset quiet splash
        EOF

        sudo extlinux --install mnt/boot/extlinux
        sync
        sudo umount mnt

    - name: Direct IMG Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.img --title "LumixOS 1.0 Raw Disk Release" --notes "ملف القرص الصلب المعدل مع معالج الإعداد التفاعلي Zorin-like لوسيم."
