name: Build LumixOS Direct Verbose Console

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools genisoimage isolinux syslinux-common syslinux-utils \
          zenity curl git gh

    - name: Create Complete RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --variant=minbase --no-check-gpg bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install System Features & Console Wizard
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # 1. تثبيت النواة الأساسية وأدوات الترحيب
        apt-get install -y --no-install-recommends \
          linux-image-686 live-boot whiptail python3 tzdata locales locales-all wget curl sudo

        # 2. إنشاء المستخدم الافتراضي
        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        # 3. معالج الإعداد التفاعلي (Setup Wizard)
        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        LANG_FILE="$CONFIG_DIR/language"
        NAME_FILE="$CONFIG_DIR/username"
        GEO_FILE="$CONFIG_DIR/timezone"

        # أ. اختيار لغة النظام
        if [ ! -f "$LANG_FILE" ]; then
            SELECTED_LANG=$(whiptail --title "LumixOS - Language / لغة النظام" \
                --menu "اختر لغتك المفضلة / Select your language:" 18 60 10 \
                "Arabic" "العربية" \
                "English" "English (US)" \
                "French" "Français" \
                "Spanish" "Español" \
                "German" "Deutsch" \
                "Italian" "Italiano" \
                "Portuguese" "Português" \
                "Russian" "Русский" \
                "Chinese" "中文" \
                "Japanese" "日本語" 3>&1 1>&2 2>&3)
            
            if [ -z "$SELECTED_LANG" ]; then
                SELECTED_LANG="Arabic"
            fi
            echo "$SELECTED_LANG" > "$LANG_FILE"
        fi

        # ب. إدخال الاسم (الافتراضي: وسيم)
        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(whiptail --inputbox "أهلاً بك يا وسيم في نظامك الخاص!\nأدخل اسمك لتخصيص الواجهة:" 10 50 "وسيم" 3>&1 1>&2 2>&3)
            if [ -z "$U_NAME" ]; then
                U_NAME="وسيم"
            fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        # ج. كلمة السر أو تخطيها
        whiptail --yesno "هل تريد إنشاء كلمة سر للحساب أم تخطي ذلك والدخول المباشر؟\n\n[نعم] = إنشاء كلمة سر\n[لا] = تخطي (دخول تلقائي)" 10 60
        if [ $? -eq 0 ]; then
            PASS=$(whiptail --passwordbox "أدخل كلمة السر الجديدة:" 10 40 3>&1 1>&2 2>&3)
            if [ -n "$PASS" ]; then
                echo "user:$PASS" | sudo chpasswd
            fi
        fi

        # د. اختيار المنطقة الزمنية
        if [ ! -f "$GEO_FILE" ]; then
            TIMEZONE=$(whiptail --title "الموقع الجغرافي / Timezone" \
                --menu "اختر منطقتك الزمنية:" 15 60 5 \
                "Africa/Casablanca" "المغرب (Casablanca)" \
                "Asia/Riyadh" "السعودية (Riyadh)" \
                "Asia/Dubai" "الإمارات (Dubai)" \
                "Europe/Paris" "فرنسا (Paris)" \
                "America/New_York" "أمريكا (New_York)" 3>&1 1>&2 2>&3)
            if [ -n "$TIMEZONE" ]; then
                sudo ln -snf /usr/share/zoneinfo/$TIMEZONE /etc/localtime
                echo "$TIMEZONE" > "$GEO_FILE"
            fi
        fi

        # هـ. نمط التثبيت
        whiptail --yesno "اختر نمط التثبيت على القرص:\n\n[نعم] = مسح القرص بالكامل وتثبيت نظيف\n[لا] = التثبيت جنباً إلى جنب مع نظامك القديم (Dual Boot)" 12 65
        if [ $? -eq 0 ]; then
            whiptail --msgbox "تم اختيار مسح القرص وتثبيت النظام بنجاح." 8 45
        else
            whiptail --msgbox "تم اختيار التثبيت بجانب النظام القديم (Dual Boot)." 8 45
        fi

        USER_NAME=$(cat "$NAME_FILE")
        whiptail --msgbox "مبارك يا $USER_NAME!\nتم إعداد بيئتك الخاصة بالكامل وبكل الخيارات بنجاح!" 10 50
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        # 4. تشغيل المعالج فوراً عند تسجيل الدخول
        echo "/usr/local/bin/lumix-setup" >> /home/user/.bashrc
        chown -R user:sudo /home/user

        # 5. هوية النظام
        echo "lumixos" > /etc/hostname
        cat << 'RELEASE' > /etc/os-release
        NAME="LumixOS"
        VERSION="1.0"
        ID=lumixos
        PRETTY_NAME="LumixOS 1.0"
        RELEASE

        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare Direct ISO Structure
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 128k

        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true

        # معلمات إقلاع صريحة ومباشرة لمنع أي توقف
        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 1

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live username=user console=tty0 nomodeset
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Direct ISO
      run: |
        genisoimage -R -J \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -o LumixOS-1.0.iso build/iso

    - name: Direct ISO Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-1.0.iso --title "LumixOS 1.0 Direct Console Release" --notes "إصدار بـ console=tty0 مباشر لتجاوز التوقف نهائياً وفتح المعالج فوراً."
