name: Build LumixOS Graphical Desktop ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        # إضافة mtools و xorriso لضمان نجاح أداة grub-mkrescue
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools genisoimage grub-pc-bin grub-common xorriso mtools \
          curl git gh

    - name: Create Full Graphical RootFS
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install Desktop Environment & Packages
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        set -e
        export DEBIAN_FRONTEND=noninteractive

        cat << 'SOURCES' > /etc/apt/sources.list
        deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware
        deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
        deb http://deb.debian.org/debian/ bookworm-updates main contrib non-free non-free-firmware
        SOURCES

        apt-get update

        apt-get install -y \
          systemd-sysv init linux-image-686-pae live-boot live-boot-initramfs-tools \
          lxde lightdm xserver-xorg-core xserver-xorg-video-vesa xserver-xorg-input-all \
          python3 sudo locales tzdata nano curl wget pciutils usbutils

        mkdir -p /etc/initramfs-tools
        echo "COMPRESS=gzip" > /etc/initramfs-tools/initramfs.conf

        systemctl mask systemd-networkd-wait-online.service || true
        systemctl mask Networking.service || true
        systemctl mask systemd-udev-settle.service || true

        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        mkdir -p /etc/lightdm/lightdm.conf.d
        cat << 'LGM' > /etc/lightdm/lightdm.conf.d/autologin.conf
        [Seat:*]
        autologin-user=user
        autologin-user-timeout=0
        LGM

        mkdir -p /home/user/Desktop
        cat << 'DESK' > /home/user/Desktop/Welcome.desktop
        [Desktop Entry]
        Type=Application
        Name=Welcome Wassim
        Exec=xterm -e "echo 'Welcome WASSIM to LumixOS Graphical Edition!' && read"
        Icon=system-run
        Terminal=true
        DESK
        chmod +x /home/user/Desktop/Welcome.desktop
        chown -R user:sudo /home/user

        echo "lumixos" > /etc/hostname
        apt-get clean
        rm -rf /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare GRUB ISO Structure
      run: |
        mkdir -p build/iso/boot/grub
        mkdir -p build/iso/live

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 128k

        cat << 'EOF' > build/iso/boot/grub/grub.cfg
        set timeout=5
        set default=0

        menuentry "Try or Install LumixOS (Graphical Desktop)" {
            linux /live/vmlinuz boot=live quiet splash nomodeset noapic nolapic
            initrd /live/initrd.img
        }

        menuentry "LumixOS (Safe Graphics / VESA Mode)" {
            linux /live/vmlinuz boot=live nomodeset xforcevesa
            initrd /live/initrd.img
        }
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Final Bootable GRUB ISO
      run: |
        grub-mkrescue -o LumixOS-Graphical.iso build/iso

    - name: Release Graphical ISO
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-graphical-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-Graphical.iso --title "LumixOS 1.0 Graphical Desktop Release" --notes "نسخة رسومية احترافية مع قائمة إقلاع GRUB وسطح مكتب LXDE متكامل."
