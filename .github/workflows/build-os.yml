name: Build Custom Boot LumixOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools grub-pc-bin grub-common wget squashfs-tools

      - name: Download Base Boot ISO
        run: |
          mkdir -p build/work
          # تحميل ملحقات وإعدادات البوت الجاهزة من دبيان/زورين الخفيفة
          wget -O build/work/base.iso https://cdimage.debian.org/debian-cd/current/i386/iso-cd/debian-12.8.0-i386-netinst.iso || \
          wget -O build/work/base.iso https://cdimage.debian.org/cdimage/archive/12.5.0/i386/iso-cd/debian-12.5.0-i386-netinst.iso

      - name: Extract ISO and Modify GRUB Config
        run: |
          mkdir -p build/iso
          xorriso -osirrox on -indev build/work/base.iso -extract / build/iso/
          chmod -R +w build/iso/

          # إنشاء ملف boot مخصص وسريع جداً لـ Limbo
          mkdir -p build/iso/boot/grub
          cat << 'EOF' > build/iso/boot/grub/grub.cfg
          set timeout=2
          set default=0

          menuentry "LumixOS Fast Edition (Welcome WASSIM)" {
              linux /install.386/vmlinuz boot=live nomodeset noapic nolapic nowatchdog nmi_watchdog=0 tsc=reliable clocksource=hpet vga=788
              initrd /install.386/initrd.gz
          }
          EOF

      - name: Rebuild Custom LumixOS ISO
        run: |
          grub-mkrescue -o LumixOS-CustomBoot.iso build/iso

      - name: Release LumixOS Custom ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-custom-${{ github.run_number }}"
          gh release create "$TAG_NAME" LumixOS-CustomBoot.iso --title "LumixOS Custom Boot Edition" --notes "Customized Boot ISO optimized for Limbo"
