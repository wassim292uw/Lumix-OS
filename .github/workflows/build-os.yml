name: Build LumixOS Full 486 Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools genisoimage isolinux syslinux-common syslinux-utils \
          curl git gh

    - name: Create Full RootFS (Debian Bookworm i386)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=i386 --include=systemd,systemd-sysv,init,live-boot,live-config,whiptail,python3,sudo,locales,tzdata,nano,pciutils,usbutils,kmod,udev,procps bookworm build/rootfs http://deb.debian.org/debian/

    - name: Install Complete Kernel & System Modules
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        apt-get install -y linux-image-486 initramfs-tools firmware-linux-free

        mkdir -p /etc/network /root/etc/network

        ln -snf /lib/systemd/systemd /sbin/init
        ln -snf /lib/systemd/systemd /bin/init

        useradd -m -s /bin/bash -g sudo user
        passwd -d user
        echo "user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        mkdir -p /usr/local/bin/
        cat << 'SETUP' > /usr/local/bin/lumix-setup
        #!/bin/bash
        CONFIG_DIR="$HOME/.config/lumix"
        mkdir -p "$CONFIG_DIR"
        NAME_FILE="$CONFIG_DIR/username"

        if [ ! -f "$NAME_FILE" ]; then
            U_NAME=$(whiptail --inputbox "Welcome WASSIM to LumixOS! Enter your name:" 10 50 "WASSIM" 3>&1 1>&2 2>&3)
            if [ -z "$U_NAME" ]; then U_NAME="WASSIM"; fi
            echo "$U_NAME" > "$NAME_FILE"
        fi

        whiptail --msgbox "Congratulations WASSIM! LumixOS booted successfully!" 10 50
        SETUP
        chmod +x /usr/local/bin/lumix-setup

        echo "/usr/local/bin/lumix-setup" >> /home/user/.bashrc
        chown -R user:sudo /home/user

        mkdir -p /etc/systemd/system/getty@tty1.service.d/
        cat << 'GETTY' > /etc/systemd/system/getty@tty1.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
        GETTY

        systemctl mask systemd-networkd-wait-online.service || true
        systemctl mask Networking.service || true

        echo "lumixos" > /etc/hostname
        apt-get clean
        rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
        EOF

        sudo umount -f build/rootfs/dev || true
        sudo umount -f build/rootfs/proc || true
        sudo umount -f build/rootfs/sys || true

    - name: Prepare ISO Structure
      run: |
        mkdir -p build/iso/live
        mkdir -p build/iso/isolinux

        K_FILE=$(sudo find build/rootfs/boot/ -type f -name "vmlinuz*" | head -n 1)
        I_FILE=$(sudo find build/rootfs/boot/ -type f -name "initrd*" | head -n 1)

        sudo cp -L "$K_FILE" build/iso/live/vmlinuz
        sudo cp -L "$I_FILE" build/iso/live/initrd.img

        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip -b 64k

        sudo cp /usr/lib/ISOLINUX/isolinux.bin build/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/isolinux/ || true

        cat << 'EOF' | sudo tee build/iso/isolinux/isolinux.cfg
        DEFAULT lumix
        PROMPT 0
        TIMEOUT 1

        LABEL lumix
          KERNEL /live/vmlinuz
          APPEND initrd=/live/initrd.img boot=live username=user console=tty1 rootdelay=3 nopv noapic nolapic nomodeset
        EOF

        sudo chmod -R 777 build/iso

    - name: Generate Full ISO
      run: |
        genisoimage -R -J \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -o LumixOS-Full.iso build/iso

    - name: Release Full ISO
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-486-${{ github.run_number }}"
        gh release create "$TAG_NAME" LumixOS-Full.iso --title "LumixOS 1.0 Full 486 Release" --notes "نسخة متكاملة مع نواة 486 المستقرة لتفادي الـ Kernel Panic وحل مشاكل التنسيق."
